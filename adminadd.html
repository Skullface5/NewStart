<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosa Fragrances | Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      transition: all 0.3s;
      padding-top: 80px;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #fffbf5;
      --bg-gradient: linear-gradient(135deg, #fff9f0 0%, #ffffff 100%);
      --text-primary: #2e2a28;
      --text-secondary: #6b5c4f;
      --accent: #d4af37;
      --accent-dark: #b4942c;
      --accent-gradient: linear-gradient(135deg, #d4af37 0%, #f5d742 50%, #d4af37 100%);
      --border: rgba(212, 175, 55, 0.2);
      --card-gradient: linear-gradient(145deg, #ffffff 0%, #fffaf2 100%);
      --hover-bg: rgba(212, 175, 55, 0.05);
    }

    body.dark {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-gradient: linear-gradient(135deg, #0a0a0a 0%, #141414 100%);
      --text-primary: #f5f5f5;
      --text-secondary: #b8b8b8;
      --accent: #ffd700;
      --accent-dark: #e6c300;
      --accent-gradient: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
      --border: rgba(255, 215, 0, 0.2);
      --card-gradient: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    body.dark header {
      background: rgba(10, 10, 10, 0.95);
    }

    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0.8rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .logo i {
      font-size: 1.8rem;
      color: var(--accent);
    }

    .logo h1 {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 350;
      color: var(--text-primary);
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .menu-toggle {
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text-primary);
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 100%;
      right: 1rem;
      width: 240px;
      background: var(--bg-primary);
      backdrop-filter: blur(10px);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s, opacity 0.2s;
      border: 1px solid var(--border);
      border-radius: 16px;
      z-index: 101;
    }

    .nav-links.active {
      max-height: 450px;
      opacity: 1;
      padding: 0.5rem 0;
    }

    .nav-links a {
      padding: 0.8rem 1.2rem;
      text-decoration: none;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      display: block;
    }

    .lang-menu {
      border-bottom: 1px solid var(--border);
    }

    .lang-current {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      padding: 0.8rem 1.2rem;
      color: var(--text-primary);
      cursor: pointer;
    }

    .lang-options {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s;
      background: var(--bg-primary);
    }

    .lang-menu.active .lang-options {
      max-height: 150px;
    }

    .lang-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.6rem 1.2rem 0.6rem 2rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .admin-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--bg-primary);
      border-radius: 42px;
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .two-column {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .two-column {
        grid-template-columns: 1fr;
      }

      .admin-wrapper {
        padding: 1.5rem;
      }
    }

    .form-panel,
    .list-panel {
      background: var(--card-gradient);
      padding: 1.5rem;
      border-radius: 28px;
      border: 1px solid var(--border);
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.8rem 1.2rem;
      color: var(--text-primary);
    }

    .season-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .season-option {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .season-option.selected {
      background: var(--accent-gradient);
      color: white;
      border-color: var(--accent);
    }

    .file-input-area {
      background: var(--bg-secondary);
      border: 1px dashed var(--border);
      border-radius: 28px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-gradient);
      border: none;
      color: var(--bg-primary);
      padding: 0.9rem;
      border-radius: 50px;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .admin-product-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .admin-product-img {
      width: 50px;
      height: 50px;
      background: var(--bg-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .admin-product-info {
      flex: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .gate {
      text-align: center;
      padding: 2rem;
    }

    .password-input {
      display: flex;
      gap: 10px;
      max-width: 320px;
      margin: 1rem auto;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--accent-gradient);
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      transform: translateY(100px);
      opacity: 0;
      transition: 0.2s;
      z-index: 300;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      body {
        padding-top: 65px;
      }

      .header-flex {
        padding: 0.6rem 1rem;
      }
    }
  </style>
</head>

<body>
  <div id="menuOverlay" class="menu-overlay"
    style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.2); backdrop-filter:blur(2px); z-index:99; display:none;">
  </div>
  <div id="adminToast" class="toast">✨ Enregistré</div>
  <header>
    <div class="header-flex"><a href="index.html" class="logo"><i class="fas fa-spa"></i>
        <h1>Rosa Fragrances</h1>
      </a>
      <div class="right-group">
        <div class="theme-toggle" id="themeToggle"><i class="fas fa-sun"></i><i class="fas fa-moon"
            style="display:none;"></i></div><button class="menu-toggle" id="menuToggle"><i
            class="fas fa-bars"></i></button>
      </div>
      <div class="nav-links" id="navLinks"><a href="index.html" data-translate="home">ACCUEIL</a><a href="#"
          data-translate="collection">COLLECTION</a><a href="#" data-translate="exclusives">EXCLUSIVITÉS</a><a href="#"
          data-translate="gifts">COFFRETS</a>
        <div class="lang-menu" id="langMenu"><button class="lang-current"><span id="currentLangText">FRANÇAIS</span><i
              class="fas fa-chevron-down"></i></button>
          <div class="lang-options"><button class="lang-option" data-lang="fr">🇫🇷 Français</button><button
              class="lang-option" data-lang="en">🇬🇧 English</button><button class="lang-option" data-lang="ar">🇸🇦
              العربية</button></div>
        </div><a href="login146.html" id="authLink" data-translate="signIn">Se connecter</a><a href="profile.html"
          id="profileLink" style="display:none;" data-translate="myProfile">Mon Profil</a>
      </div>
    </div>
  </header>
  <div class="admin-wrapper" id="adminWrapper">
    <div id="gatePanel" class="gate"><i class="fas fa-spa"
        style="font-size:2.5rem; color:var(--accent); margin-bottom:1rem;"></i>
      <h2 data-translate="adminTitle">Espace propriétaire</h2>
      <div class="password-input"><input type="password" id="passwordInput" placeholder="Mot de passe"><button
          id="unlockBtn"><i class="fas fa-arrow-right"></i></button></div>
      <div class="hint" style="margin-top:1rem; color:var(--text-secondary);">🔐 Mot de passe: <strong>rosa</strong>
      </div><a href="index.html" class="back-link"
        style="display:inline-block; margin-top:1rem; color:var(--accent); text-decoration:none;"><i
          class="fas fa-arrow-left"></i> <span data-translate="backToShop">Retour à la boutique</span></a>
    </div>
    <div id="adminPanel" style="display:none;">
      <h1 style="margin-bottom:1.5rem;"><i class="fas fa-spa"></i> <span data-translate="manageProducts">Gérer les
          produits</span></h1>
      <div class="two-column">
        <div class="form-panel">
          <h2 style="margin-bottom:1rem;"><i class="fas fa-plus-circle"></i> <span data-translate="addProduct">Ajouter
              un parfum</span></h2>
          <div class="input-group"><label data-translate="productName">Nom du produit</label><input type="text"
              id="productName" placeholder="ex. Bois d'Argent"></div>
          <div class="input-group"><label data-translate="brand">Marque / Maison</label><input type="text"
              id="productBrand"></div>
          <div class="input-group"><label data-translate="price">Prix (TND)</label><input type="number"
              id="productPrice" step="0.001" min="0"></div>
          <div class="input-group"><label data-translate="season">Saison</label>
            <div class="season-selector" id="seasonSelector">
              <div class="season-option selected" data-season="all"><i class="fas fa-globe"></i> Toutes saisons</div>
              <div class="season-option" data-season="summer"><i class="fas fa-sun"></i> Été</div>
              <div class="season-option" data-season="winter"><i class="fas fa-snowflake"></i> Hiver</div>
              <div class="season-option" data-season="spring"><i class="fas fa-seedling"></i> Printemps</div>
              <div class="season-option" data-season="autumn"><i class="fas fa-leaf"></i> Automne</div>
            </div>
          </div>
          <div class="input-group"><label data-translate="image">Image du produit</label>
            <div class="file-input-area" id="fileInputArea"><i class="fas fa-cloud-upload-alt"></i>
              <p data-translate="clickToUpload">Cliquez pour sélectionner une image</p><input type="file"
                id="imageUpload" accept="image/*" style="display:none;">
            </div>
            <div id="imagePreview"
              style="display:none; margin-top:10px; display:flex; align-items:center; gap:10px; background:var(--bg-secondary); padding:0.5rem 1rem; border-radius:40px;">
              <img id="previewImg" style="width:40px; height:40px; border-radius:50%;"><span
                id="previewFilename"></span><i class="fas fa-times" id="clearPreview"
                style="cursor:pointer; color:var(--accent);"></i></div>
          </div><button class="btn-primary" id="addProductBtn"><i class="fas fa-gem"></i> <span
              data-translate="saveProduct">Enregistrer le produit</span></button>
        </div>
        <div class="list-panel">
          <h2 style="margin-bottom:1rem;"><i class="fas fa-box-open"></i> <span
              data-translate="existingProducts">Parfums existants</span></h2>
          <div id="adminProductListContainer"></div>
        </div>
      </div>
      <div style="margin-top:1rem; text-align:right;"><button id="logoutBtn"
          style="background:none; border:none; color:var(--accent); cursor:pointer;"><i class="fas fa-sign-out-alt"></i>
          <span data-translate="logout">Se déconnecter</span></button></div>
    </div>
  </div>
  <script>
    // Translation system
    const translations = {
      fr: { home: 'ACCUEIL', collection: 'COLLECTION', exclusives: 'EXCLUSIVITÉS', gifts: 'COFFRETS', signIn: 'Se connecter', myProfile: 'Mon Profil', adminTitle: 'Espace propriétaire', backToShop: 'Retour à la boutique', manageProducts: 'Gérer les produits', addProduct: 'Ajouter un parfum', productName: 'Nom du produit', brand: 'Marque / Maison', price: 'Prix (TND)', season: 'Saison', image: 'Image du produit', clickToUpload: 'Cliquez pour sélectionner une image', saveProduct: 'Enregistrer le produit', existingProducts: 'Parfums existants', logout: 'Se déconnecter' },
      en: { home: 'HOME', collection: 'COLLECTION', exclusives: 'EXCLUSIVES', gifts: 'GIFTS', signIn: 'Sign in', myProfile: 'My Profile', adminTitle: 'Owner Space', backToShop: 'Back to shop', manageProducts: 'Manage Products', addProduct: 'Add Perfume', productName: 'Product Name', brand: 'Brand', price: 'Price (TND)', season: 'Season', image: 'Product Image', clickToUpload: 'Click to select an image', saveProduct: 'Save Product', existingProducts: 'Existing Perfumes', logout: 'Logout' },
      ar: { home: 'الرئيسية', collection: 'المجموعة', exclusives: 'الحصريات', gifts: 'الهدايا', signIn: 'تسجيل الدخول', myProfile: 'ملفي الشخصي', adminTitle: 'مساحة المالك', backToShop: 'العودة إلى المتجر', manageProducts: 'إدارة المنتجات', addProduct: 'إضافة عطر', productName: 'اسم المنتج', brand: 'العلامة التجارية', price: 'السعر (TND)', season: 'الموسم', image: 'صورة المنتج', clickToUpload: 'انقر لتحديد صورة', saveProduct: 'حفظ المنتج', existingProducts: 'العطور الموجودة', logout: 'تسجيل الخروج' }
    };
    let currentLang = localStorage.getItem('language') || 'fr';
    function applyTranslations() { document.querySelectorAll('[data-translate]').forEach(el => { const key = el.getAttribute('data-translate'); if (translations[currentLang][key]) el.textContent = translations[currentLang][key]; }); document.body.style.direction = currentLang === 'ar' ? 'rtl' : 'ltr'; }
    function setLanguage(lang) { currentLang = lang; localStorage.setItem('language', lang); applyTranslations(); }
    applyTranslations();
    document.querySelectorAll('.lang-option').forEach(opt => { opt.addEventListener('click', (e) => { e.stopPropagation(); setLanguage(opt.dataset.lang); document.getElementById('currentLangText').textContent = { fr: 'FRANÇAIS', en: 'ENGLISH', ar: 'العربية' }[opt.dataset.lang]; document.getElementById('langMenu')?.classList.remove('active'); }); });
    const langMenu = document.getElementById('langMenu'); const langCurrent = document.querySelector('.lang-current'); if (langCurrent) langCurrent.addEventListener('click', (e) => { e.stopPropagation(); langMenu.classList.toggle('active'); });
    document.addEventListener('click', (e) => { if (langMenu && !langMenu.contains(e.target)) langMenu.classList.remove('active'); });
    // Admin logic
    const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let uploadedImageBase64 = null, selectedSeason = 'all';
    function showToast(msg) { const t = document.getElementById('adminToast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    async function loadProducts() { try { const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: true }); if (error) throw error; const container = document.getElementById('adminProductListContainer'); if (!data || data.length === 0) { container.innerHTML = '<div class="empty-list" style="text-align:center; padding:2rem;">✨ Aucun parfum</div>'; return; } let html = ''; data.forEach(p => { const imgHtml = p.image ? `<img src="${p.image}" style="width:100%; height:100%; object-fit:cover;">` : `<i class="fas fa-crown"></i>`; html += `<div class="admin-product-item"><div class="admin-product-img">${imgHtml}</div><div class="admin-product-info"><div><strong>${p.name}</strong></div><div style="font-size:0.7rem; color:var(--accent);">${p.brand}</div><div>${parseFloat(p.price).toFixed(3).replace('.', ',')} TND</div></div><button class="delete-btn" data-id="${p.id}"><i class="fas fa-trash-alt"></i></button></div>`; }); container.innerHTML = html; document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deleteProduct(btn.dataset.id))); } catch (e) { console.error(e); showToast('❌ Erreur'); } }
    async function addProduct() { const name = document.getElementById('productName').value.trim(); const brand = document.getElementById('productBrand').value.trim(); const price = parseFloat(document.getElementById('productPrice').value); if (!name || !brand || isNaN(price) || price <= 0) { showToast('❌ Champs requis'); return; } try { const { error } = await supabase.from('products').insert([{ name, brand, price, icon: 'fa-crown', season: selectedSeason, image: uploadedImageBase64 || null }]); if (error) throw error; showToast('✅ Produit ajouté'); document.getElementById('productName').value = ''; document.getElementById('productBrand').value = ''; document.getElementById('productPrice').value = ''; uploadedImageBase64 = null; document.getElementById('imagePreview').style.display = 'none'; document.getElementById('imageUpload').value = ''; loadProducts(); } catch (e) { console.error(e); showToast('❌ Erreur'); } }
    async function deleteProduct(id) { if (!confirm('Supprimer ?')) return; try { await supabase.from('products').delete().match({ id }); showToast('🗑️ Supprimé'); loadProducts(); } catch (e) { showToast('❌ Erreur'); } }
    document.getElementById('addProductBtn')?.addEventListener('click', addProduct);
    document.getElementById('unlockBtn')?.addEventListener('click', () => { if (document.getElementById('passwordInput').value === 'rosa') { document.getElementById('gatePanel').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; loadProducts(); } else { alert('❌ Mot de passe incorrect'); } });
    document.getElementById('logoutBtn')?.addEventListener('click', () => { document.getElementById('adminPanel').style.display = 'none'; document.getElementById('gatePanel').style.display = 'block'; document.getElementById('passwordInput').value = ''; });
    document.querySelectorAll('.season-option').forEach(opt => { opt.addEventListener('click', () => { document.querySelectorAll('.season-option').forEach(o => o.classList.remove('selected')); opt.classList.add('selected'); selectedSeason = opt.dataset.season; }); });
    const fileArea = document.getElementById('fileInputArea'); const fileInput = document.getElementById('imageUpload'); fileArea?.addEventListener('click', () => fileInput.click()); fileInput?.addEventListener('change', (e) => { const file = e.target.files[0]; if (file && file.type.startsWith('image/')) { const reader = new FileReader(); reader.onload = (ev) => { uploadedImageBase64 = ev.target.result; document.getElementById('previewImg').src = ev.target.result; document.getElementById('previewFilename').textContent = file.name.substring(0, 20); document.getElementById('imagePreview').style.display = 'flex'; }; reader.readAsDataURL(file); } }); document.getElementById('clearPreview')?.addEventListener('click', () => { uploadedImageBase64 = null; document.getElementById('imagePreview').style.display = 'none'; fileInput.value = ''; });
    function initTheme() { const saved = localStorage.getItem('theme') || 'light'; if (saved === 'dark') { document.body.classList.add('dark'); document.querySelector('#themeToggle .fa-sun').style.display = 'none'; document.querySelector('#themeToggle .fa-moon').style.display = 'inline-block'; } else { document.body.classList.remove('dark'); document.querySelector('#themeToggle .fa-sun').style.display = 'inline-block'; document.querySelector('#themeToggle .fa-moon').style.display = 'none'; } }
    function toggleTheme() { if (document.body.classList.contains('dark')) { document.body.classList.remove('dark'); localStorage.setItem('theme', 'light'); document.querySelector('#themeToggle .fa-sun').style.display = 'inline-block'; document.querySelector('#themeToggle .fa-moon').style.display = 'none'; } else { document.body.classList.add('dark'); localStorage.setItem('theme', 'dark'); document.querySelector('#themeToggle .fa-sun').style.display = 'none'; document.querySelector('#themeToggle .fa-moon').style.display = 'inline-block'; } }
    document.getElementById('themeToggle')?.addEventListener('click', toggleTheme); initTheme();
    function toggleMenu() { const nav = document.getElementById('navLinks'); const overlay = document.getElementById('menuOverlay'); if (nav.classList.contains('active')) { nav.classList.remove('active'); overlay.style.display = 'none'; document.body.style.overflow = ''; } else { nav.classList.add('active'); overlay.style.display = 'block'; document.body.style.overflow = 'hidden'; } }
    document.getElementById('menuToggle')?.addEventListener('click', toggleMenu); document.getElementById('menuOverlay')?.addEventListener('click', toggleMenu);
    async function updateAuthDisplay() { const { data: { user } } = await supabase.auth.getUser(); const authLink = document.getElementById('authLink'); const profileLink = document.getElementById('profileLink'); if (user) { if (authLink) authLink.style.display = 'none'; if (profileLink) profileLink.style.display = 'block'; } else { if (authLink) authLink.style.display = 'block'; if (profileLink) profileLink.style.display = 'none'; } }
    updateAuthDisplay(); supabase.auth.onAuthStateChange(() => updateAuthDisplay());
  </script>
</body>

</html>
