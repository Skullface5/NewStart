<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Rosa Fragrances · Console Administrateur</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f4efe9;
      color: #2c2824;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .admin-wrapper {
      max-width: 1100px;
      width: 100%;
      background: #ffffffd9;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 42px;
      box-shadow: 0 30px 50px -25px rgba(98, 78, 62, 0.3);
      border: 1px solid #ede3da;
      overflow: hidden;
      padding: 2.2rem 2.5rem;
    }

    h1 {
      font-weight: 320;
      font-size: 2.2rem;
      letter-spacing: 0.02em;
      color: #3f3730;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #e3d8cf;
      padding-bottom: 1.2rem;
      margin-bottom: 2rem;
    }

    h1 i {
      color: #b6987a;
      font-size: 2.4rem;
    }

    h2 {
      font-weight: 350;
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5f5348;
      margin-bottom: 1.2rem;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 2.2rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .two-column {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .admin-wrapper {
        padding: 1.5rem;
      }
    }

    .form-panel {
      background: #fcf9f6;
      padding: 1.8rem 2rem;
      border-radius: 32px;
      border: 1px solid #e7dcd2;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 8px 18px -12px rgba(87, 67, 52, 0.2);
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #937f6e;
      margin-bottom: 0.4rem;
    }

    input,
    select {
      width: 100%;
      background: white;
      border: 1px solid #dbcec2;
      border-radius: 60px;
      padding: 0.9rem 1.4rem;
      font-size: 0.95rem;
      color: #2c2824;
      outline: none;
      transition: 0.15s;
    }

    input:focus,
    select:focus {
      border-color: #b6987a;
      box-shadow: 0 0 0 3px #eeddd2;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    .icon-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }

    .icon-option {
      background: white;
      border: 1px solid #dacfc6;
      border-radius: 50px;
      padding: 0.6rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #3f3730;
    }

    .icon-option i {
      font-size: 1.1rem;
      color: #b6987a;
    }

    .icon-option.selected {
      background: #b6987a;
      border-color: #b6987a;
      color: white;
    }

    .icon-option.selected i {
      color: white;
    }

    .icon-option:hover {
      border-color: #b6987a;
      background: #f5ede6;
    }

    .file-input-area {
      background: #f7f2ec;
      border: 1px dashed #cbb9aa;
      border-radius: 34px;
      padding: 1.2rem 1.4rem;
      text-align: center;
      color: #7a6a5c;
      cursor: pointer;
      transition: 0.2s;
    }

    .file-input-area:hover {
      background: #f1e8df;
      border-color: #b6987a;
    }

    .file-input-area i {
      font-size: 1.8rem;
      color: #b6987a;
      margin-bottom: 6px;
    }

    #imagePreview {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff5ed;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #e2d3c6;
    }

    #imagePreview img {
      width: 48px;
      height: 48px;
      border-radius: 30px;
      object-fit: cover;
    }

    .btn-primary {
      background: #b6987a;
      border: none;
      color: white;
      padding: 1rem 2.2rem;
      border-radius: 60px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      background: #a07d63;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .list-panel {
      background: #fcf9f6;
      padding: 1.8rem 1.5rem;
      border-radius: 32px;
      border: 1px solid #e7dcd2;
      max-height: 540px;
      overflow-y: auto;
    }

    .admin-product-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 0.8rem;
      border-bottom: 1px solid #ece0d6;
    }

    .admin-product-item:last-child {
      border-bottom: none;
    }

    .admin-product-img {
      width: 54px;
      height: 54px;
      background: #e9dfd6;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .admin-product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .admin-product-img i {
      font-size: 2rem;
      color: #8f7c6b;
    }

    .admin-product-info {
      flex: 1;
    }

    .admin-product-title {
      font-weight: 500;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .admin-product-brand {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #b6987a;
      letter-spacing: 0.1em;
    }

    .admin-product-price {
      font-weight: 350;
      color: #3f3730;
    }

    .admin-product-price::before {
      content: '€';
      margin-right: 2px;
      color: #887b70;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #b7a597;
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.15s;
      padding: 6px;
    }

    .delete-btn:hover {
      color: #c1654c;
    }

    .empty-list {
      color: #ad9f93;
      text-align: center;
      font-style: italic;
      padding: 2rem 0;
    }

    .gate {
      background: #fcf9f6;
      border-radius: 48px;
      padding: 2.5rem 2rem;
      text-align: center;
      border: 1px solid #ece0d6;
    }

    .gate h2 {
      margin-bottom: 1.8rem;
    }

    .password-input {
      display: flex;
      gap: 10px;
      max-width: 360px;
      margin: 0 auto;
    }

    .password-input input {
      flex: 1;
    }

    .password-input button {
      background: #b6987a;
      border: none;
      color: white;
      padding: 0 1.6rem;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
    }

    .hint {
      margin-top: 1rem;
      color: #a49182;
      font-size: 0.8rem;
    }

    .back-link {
      margin-top: 2rem;
      display: inline-block;
      color: #b6987a;
      text-decoration: none;
      border-bottom: 1px dotted;
    }

    hr {
      border: 0.5px solid #ece0d6;
      margin: 1.5rem 0;
    }

    .admin-toast {
      position: fixed;
      bottom: 30px;
      left: 30px;
      background: #2c2824;
      color: #f0e7de;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: translateY(80px);
      transition: 0.2s;
      z-index: 1000;
    }

    .admin-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .loading-spinner {
      text-align: center;
      padding: 2rem;
      color: #b6987a;
    }
  </style>
</head>

<body>
  <!-- Floating Gold Particles -->
  <script>
    for (let i = 0; i < 40; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 6 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = Math.random() * 10 + 8 + 's';
      particle.style.opacity = Math.random() * 0.4 + 0.1;
      document.body.appendChild(particle);
    }
  </script>

  <style>
    .particle {
      position: fixed;
      background: radial-gradient(circle, #d4af37 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: floatParticle 12s infinite;
      z-index: 0;
    }

    @keyframes floatParticle {
      0% {
        opacity: 0;
        transform: translateY(100vh) rotate(0deg);
      }

      10% {
        opacity: 0.3;
      }

      90% {
        opacity: 0.3;
      }

      100% {
        opacity: 0;
        transform: translateY(-20vh) rotate(360deg);
      }
    }
  </style>

  <div class="admin-wrapper" id="adminWrapper">
    <!-- GATE PANEL -->
    <div id="gatePanel" class="gate">
      <i class="fas fa-spa" style="font-size: 2.5rem; color: #b6987a; margin-bottom: 1rem;"></i>
      <h2>Espace propriétaire</h2>
      <div class="password-input">
        <input type="password" id="passwordInput" placeholder="Mot de passe" value="">
        <button id="unlockBtn"><i class="fas fa-arrow-right"></i></button>
      </div>
      <div class="hint">🔐 Mot de passe: <strong>rosa</strong></div>
      <a href="index.html" id="backToShopLink" class="back-link"><i class="fas fa-arrow-left"></i> Retour à la
        boutique</a>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display: none;">
      <h1>
        <i class="fas fa-pen-nib"></i> Rosa Fragrances · Gérer les produits
        <span style="flex:1; text-align: right; font-size: 0.8rem; opacity:0.7;" id="loggedInAs"></span>
      </h1>

      <div class="two-column">
        <!-- FORMULAIRE AJOUT PRODUIT -->
        <div class="form-panel">
          <h2><i class="fas fa-plus-circle" style="margin-right: 10px;"></i>Ajouter un parfum</h2>
          <div class="input-group">
            <label>Nom du produit</label>
            <input type="text" id="productName" placeholder="ex. Bois d'Argent" autocomplete="off">
          </div>
          <div class="input-group">
            <label>Marque / Maison</label>
            <input type="text" id="productBrand" placeholder="PHYSALIS / NAEVE ...">
          </div>
          <div class="input-group">
            <label>Prix (TND)</label>
            <input type="number" id="productPrice" step="0.001" min="0" placeholder="0.000">
          </div>

          <!-- Sélection d'icône -->
          <div class="input-group">
            <label>Icône (si pas d'image)</label>
            <div class="icon-selector" id="iconSelector">
              <div class="icon-option selected" data-icon="fa-leaf"><i class="fas fa-leaf"></i> Feuille</div>
              <div class="icon-option" data-icon="fa-plant-wilt"><i class="fas fa-plant-wilt"></i> Plante</div>
              <div class="icon-option" data-icon="fa-tree"><i class="fas fa-tree"></i> Bois</div>
              <div class="icon-option" data-icon="fa-flower"><i class="fas fa-flower"></i> Fleur</div>
              <div class="icon-option" data-icon="fa-cloud-moon"><i class="fas fa-cloud-moon"></i> Fumée</div>
              <div class="icon-option" data-icon="fa-crown"><i class="fas fa-crown"></i> Prestige</div>
            </div>
          </div>

          <!-- Téléchargement d'image -->
          <div class="input-group">
            <label>Image du produit</label>
            <div class="file-input-area" id="fileInputArea">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Cliquez pour sélectionner une image</p>
              <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>
            <div id="imagePreview" style="display: none;">
              <img id="previewImg" src="#" alt="aperçu">
              <span id="previewFilename"></span>
              <i class="fas fa-times" id="clearPreview" style="margin-left: auto; cursor:pointer; color:#b6987a;"></i>
            </div>
          </div>

          <button class="btn-primary" id="addProductBtn"><i class="fas fa-gem"></i> Enregistrer le produit</button>
          <hr>
          <p style="font-size:0.75rem; color:#aa9b8e;"><i class="fas fa-info-circle"></i> Les images sont stockées en
            Base64</p>
        </div>

        <!-- LISTE DES PRODUITS -->
        <div class="list-panel">
          <h2><i class="fas fa-box-open" style="margin-right: 10px;"></i>Parfums existants</h2>
          <div id="loadingAdmin" class="loading-spinner" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Chargement...
          </div>
          <div id="adminProductListContainer"></div>
        </div>
      </div>
      <div style="margin-top: 1.5rem; text-align: right;">
        <button id="logoutBtn"
          style="background:none; border:none; color:#b6987a; cursor:pointer; text-decoration:underline;">
          <i class="fas fa-sign-out-alt"></i> se déconnecter
        </button>
      </div>
    </div>
  </div>

  <div id="adminToast" class="admin-toast">✨ Enregistré</div>

  <script>
    (function () {
      // Supabase Config
      const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      // Password Gate
      const GATE_PASSWORD = 'rosa';
      const gatePanel = document.getElementById('gatePanel');
      const adminPanel = document.getElementById('adminPanel');
      const unlockBtn = document.getElementById('unlockBtn');
      const passwordInput = document.getElementById('passwordInput');
      const backLink = document.getElementById('backToShopLink');
      const logoutBtn = document.getElementById('logoutBtn');
      const loggedInSpan = document.getElementById('loggedInAs');
      const loadingAdmin = document.getElementById('loadingAdmin');
      const adminListContainer = document.getElementById('adminProductListContainer');

      // Form Elements
      const productName = document.getElementById('productName');
      const productBrand = document.getElementById('productBrand');
      const productPrice = document.getElementById('productPrice');
      const iconOptions = document.querySelectorAll('.icon-option');
      let selectedIcon = 'fa-leaf';

      // Image Upload
      const fileInput = document.getElementById('imageUpload');
      const fileArea = document.getElementById('fileInputArea');
      const imagePreview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      const previewFilename = document.getElementById('previewFilename');
      const clearPreview = document.getElementById('clearPreview');
      let uploadedImageBase64 = null;

      function showAdminToast(msg) {
        const toast = document.getElementById('adminToast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      // Load Products
      async function loadAdminProducts() {
        try {
          adminListContainer.innerHTML = '';
          loadingAdmin.style.display = 'block';

          const { data, error } = await supabase
            .from('products')
            .select('*')
            .order('created_at', { ascending: true });

          if (error) throw error;

          loadingAdmin.style.display = 'none';

          if (!data || data.length === 0) {
            adminListContainer.innerHTML = '<div class="empty-list">✨ Aucun parfum. Ajoutez le premier.</div>';
            return;
          }

          let html = '';
          data.forEach(prod => {
            const priceStr = parseFloat(prod.price).toFixed(3).replace('.', ',');
            const iconOrImage = prod.image
              ? `<img src="${prod.image}" alt="${prod.name}">`
              : `<i class="fas ${prod.icon || 'fa-leaf'}"></i>`;

            html += `
              <div class="admin-product-item" data-id="${prod.id}">
                <div class="admin-product-img">${iconOrImage}</div>
                <div class="admin-product-info">
                  <div class="admin-product-title">${prod.name}</div>
                  <div class="admin-product-brand">${prod.brand}</div>
                  <div class="admin-product-price">${priceStr} TND</div>
                </div>
                <button class="delete-btn" data-id="${prod.id}" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
              </div>
            `;
          });
          adminListContainer.innerHTML = html;
        } catch (error) {
          console.error('Erreur chargement:', error);
          loadingAdmin.style.display = 'none';
          adminListContainer.innerHTML = '<div class="empty-list">❌ Erreur de chargement</div>';
          showAdminToast('❌ Erreur chargement produits');
        }
      }

      // Add Product
      async function addProduct() {
        const name = productName.value.trim();
        const brand = productBrand.value.trim();
        const price = parseFloat(productPrice.value);

        if (!name || !brand || isNaN(price) || price <= 0) {
          showAdminToast('❌ Nom, marque et prix valides requis');
          return;
        }

        try {
          const newProduct = {
            name: name,
            brand: brand,
            price: price,
            icon: selectedIcon,
            image: uploadedImageBase64 || null
          };

          const { error } = await supabase
            .from('products')
            .insert([newProduct]);

          if (error) throw error;

          productName.value = '';
          productBrand.value = '';
          productPrice.value = '';

          iconOptions.forEach(o => o.classList.remove('selected'));
          document.querySelector('.icon-option[data-icon="fa-leaf"]').classList.add('selected');
          selectedIcon = 'fa-leaf';

          uploadedImageBase64 = null;
          imagePreview.style.display = 'none';
          fileInput.value = '';

          showAdminToast('✅ Produit ajouté');
          loadAdminProducts();
        } catch (error) {
          console.error('Erreur ajout:', error);
          showAdminToast('❌ Erreur lors de l\'ajout');
        }
      }

      // Delete Product
      async function deleteProduct(id) {
        if (!confirm('Supprimer ce produit ?')) return;

        try {
          const { error } = await supabase
            .from('products')
            .delete()
            .match({ id });

          if (error) throw error;

          showAdminToast('🗑️ Produit supprimé');
          loadAdminProducts();
        } catch (error) {
          console.error('Erreur suppression:', error);
          showAdminToast('❌ Erreur lors de la suppression');
        }
      }

      // Event Listeners
      unlockBtn.addEventListener('click', () => {
        if (passwordInput.value === GATE_PASSWORD) {
          gatePanel.style.display = 'none';
          adminPanel.style.display = 'block';
          loggedInSpan.textContent = '⚡ propriétaire · ' + new Date().toLocaleDateString('fr-FR');
          loadAdminProducts();
        } else {
          alert('❌ Mot de passe incorrect');
        }
      });

      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') unlockBtn.click();
      });

      logoutBtn.addEventListener('click', () => {
        adminPanel.style.display = 'none';
        gatePanel.style.display = 'block';
        passwordInput.value = '';
      });

      backLink.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = 'index.html';
      });

      // Icon selector
      iconOptions.forEach(opt => {
        opt.addEventListener('click', () => {
          iconOptions.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          selectedIcon = opt.dataset.icon;
        });
      });

      // Image upload
      fileArea.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          uploadedImageBase64 = ev.target.result;
          previewImg.src = ev.target.result;
          previewFilename.textContent = file.name.length > 20 ? file.name.substr(0, 18) + '…' : file.name;
          imagePreview.style.display = 'flex';
        };
        reader.readAsDataURL(file);
      });

      clearPreview.addEventListener('click', () => {
        uploadedImageBase64 = null;
        imagePreview.style.display = 'none';
        fileInput.value = '';
      });

      document.getElementById('addProductBtn').addEventListener('click', addProduct);

      adminListContainer.addEventListener('click', (e) => {
        const deleteBtn = e.target.closest('.delete-btn');
        if (deleteBtn) {
          const id = deleteBtn.dataset.id;
          deleteProduct(id);
        }
      });
    })();

    // ========== DEEPL TRANSLATION ==========
    let currentLanguage = localStorage.getItem('language') || 'fr';
    let originalTexts = new Map();

    function storeOriginalTexts() {
      const elementsToStore = [
        document.querySelector('.gate h2'),
        document.querySelector('#passwordInput'),
        document.querySelector('.gate .hint'),
        document.querySelector('#backToShopLink'),
        document.querySelector('#authLink'),
        document.querySelector('#profileLink'),
        document.querySelector('#adminPanel h1'),
        document.querySelector('.form-panel h2'),
        ...document.querySelectorAll('.form-panel label'),
        document.querySelector('#productName'),
        document.querySelector('#productBrand'),
        document.querySelector('#productPrice'),
        document.querySelector('.file-input-area p'),
        document.querySelector('#addProductBtn'),
        document.querySelector('.list-panel h2'),
        document.querySelector('#logoutBtn'),
        document.querySelector('.form-panel hr + p'),
        ...document.querySelectorAll('.icon-option')
      ];

      elementsToStore.forEach(el => {
        if (el && el.textContent && el.textContent.trim() && !originalTexts.has(el)) {
          originalTexts.set(el, el.textContent);
        }
      });
    }

    function resetToFrench() {
      originalTexts.forEach((originalText, element) => {
        if (element && element.isConnected) {
          if (element.tagName === 'INPUT') {
            element.placeholder = originalText;
          } else {
            element.textContent = originalText;
          }
        }
      });
      document.body.style.direction = 'ltr';
      currentLanguage = 'fr';
      localStorage.setItem('language', 'fr');
    }

    async function translatePage(targetLang) {
      if (targetLang === 'fr') {
        resetToFrench();
        return;
      }
      if (targetLang === currentLanguage && currentLanguage !== 'fr') return;

      const toast = document.getElementById('adminToast');
      if (toast) {
        toast.textContent = '🌍 Traduction en cours...';
        toast.classList.add('show');
      }

      if (originalTexts.size === 0) storeOriginalTexts();

      const elementsToTranslate = [];
      const textsToTranslate = [];

      originalTexts.forEach((originalText, element) => {
        if (element && element.isConnected && originalText && originalText.trim()) {
          textsToTranslate.push(originalText);
          elementsToTranslate.push(element);
        }
      });

      if (textsToTranslate.length === 0) {
        if (toast) toast.classList.remove('show');
        return;
      }

      try {
        const response = await fetch('https://dtwciuhwwanwlwpydeko.supabase.co/functions/v1/translate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_'
          },
          body: JSON.stringify({
            texts: textsToTranslate,
            targetLang: targetLang,
            sourceLang: 'FR'
          })
        });

        const data = await response.json();

        if (data.success && data.translations) {
          elementsToTranslate.forEach((element, index) => {
            const translated = data.translations[index];
            if (translated && translated !== element.textContent) {
              if (element.tagName === 'INPUT') {
                element.placeholder = translated;
              } else {
                element.textContent = translated;
              }
            }
          });
        }

        if (targetLang === 'ar') {
          document.body.style.direction = 'rtl';
        } else {
          document.body.style.direction = 'ltr';
        }

        currentLanguage = targetLang;
        localStorage.setItem('language', targetLang);

        if (toast) {
          toast.textContent = '✅ Traduction terminée!';
          setTimeout(() => toast.classList.remove('show'), 1500);
        }
      } catch (error) {
        console.error('Translation error:', error);
        if (toast) {
          toast.textContent = '❌ Erreur de traduction';
          setTimeout(() => toast.classList.remove('show'), 2000);
        }
      }
    }

    function setupLanguageSwitcher() {
      const langOptions = document.querySelectorAll('.lang-option');
      const currentLangSpan = document.getElementById('currentLangText');

      langOptions.forEach(option => {
        option.addEventListener('click', async () => {
          const lang = option.getAttribute('data-lang');
          const langNames = { fr: 'FRANÇAIS', en: 'ENGLISH', ar: 'العربية' };
          if (currentLangSpan) currentLangSpan.textContent = langNames[lang];
          document.getElementById('langMenu')?.classList.remove('active');
          await translatePage(lang);
        });
      });
    }

    function initLanguage() {
      storeOriginalTexts();
      const savedLang = localStorage.getItem('language') || 'fr';
      const langNames = { fr: 'FRANÇAIS', en: 'ENGLISH', ar: 'العربية' };
      const currentLangSpan = document.getElementById('currentLangText');
      if (currentLangSpan) currentLangSpan.textContent = langNames[savedLang];
      if (savedLang !== 'fr') translatePage(savedLang);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupLanguageSwitcher();
      initLanguage();
    });
  </script>
</body>

</html>
