<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Sillage · Console Administrateur</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .admin-wrapper {
      max-width: 1100px;
      width: 100%;
      background: var(--bg-primary);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 42px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
      overflow: hidden;
      padding: 2.2rem 2.5rem;
      transition: all 0.3s ease;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-weight: 320;
      font-size: 2rem;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
      margin-bottom: 2rem;
    }

    h1 i {
      color: var(--accent);
      font-size: 2.2rem;
    }

    h2 {
      font-weight: 350;
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .two-column {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .admin-wrapper {
        padding: 1.5rem;
      }
    }

    /* Form Panel */
    .form-panel {
      background: var(--card-gradient);
      padding: 1.8rem;
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      transition: all 0.3s;
    }

    .form-panel:hover {
      box-shadow: var(--shadow-lg);
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    input,
    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.8rem 1.2rem;
      font-size: 0.9rem;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
      transform: translateX(2px);
    }

    /* Icon Selector */
    .icon-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .icon-option {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.5rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-primary);
    }

    .icon-option i {
      font-size: 1rem;
      color: var(--accent);
    }

    .icon-option.selected {
      background: var(--accent-gradient);
      border-color: var(--accent);
      color: white;
    }

    .icon-option.selected i {
      color: white;
    }

    .icon-option:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* File Upload */
    .file-input-area {
      background: var(--bg-secondary);
      border: 1px dashed var(--border);
      border-radius: 28px;
      padding: 1rem;
      text-align: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-input-area:hover {
      border-color: var(--accent);
      background: var(--hover-bg);
    }

    .file-input-area i {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 5px;
    }

    #imagePreview {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
      padding: 0.5rem 1rem;
      border-radius: 40px;
      border: 1px solid var(--border);
    }

    #imagePreview img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Buttons */
    .btn-primary {
      background: var(--accent-gradient);
      border: none;
      color: var(--bg-primary);
      padding: 0.9rem;
      border-radius: 50px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-primary:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    /* List Panel */
    .list-panel {
      background: var(--card-gradient);
      padding: 1.5rem;
      border-radius: 28px;
      border: 1px solid var(--border);
      max-height: 550px;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }

    .list-panel::-webkit-scrollbar {
      width: 6px;
    }

    .list-panel::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 3px;
    }

    .list-panel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    .admin-product-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s;
    }

    .admin-product-item:hover {
      background: var(--hover-bg);
      border-radius: 16px;
      transform: translateX(5px);
    }

    .admin-product-img {
      width: 50px;
      height: 50px;
      background: var(--bg-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .admin-product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .admin-product-img i {
      font-size: 1.6rem;
      color: var(--accent);
    }

    .admin-product-info {
      flex: 1;
    }

    .admin-product-title {
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .admin-product-brand {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .admin-product-price {
      font-weight: 500;
      color: var(--accent-dark);
      font-size: 0.9rem;
    }

    .admin-product-price::before {
      content: 'TND ';
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      padding: 8px;
      border-radius: 50%;
    }

    .delete-btn:hover {
      color: #c1654c;
      background: var(--hover-bg);
      transform: scale(1.1);
    }

    .empty-list {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Gate Panel */
    .gate {
      background: var(--card-gradient);
      border-radius: 40px;
      padding: 2rem;
      text-align: center;
      border: 1px solid var(--border);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .gate h2 {
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .password-input {
      display: flex;
      gap: 10px;
      max-width: 320px;
      margin: 0 auto;
    }

    .password-input input {
      flex: 1;
    }

    .password-input button {
      background: var(--accent-gradient);
      border: none;
      color: var(--bg-primary);
      padding: 0 1.5rem;
      border-radius: 50px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .password-input button:hover {
      transform: scale(1.02);
    }

    .hint {
      margin-top: 1rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .back-link {
      margin-top: 1.5rem;
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent);
      transition: all 0.2s;
    }

    .back-link:hover {
      color: var(--accent-dark);
      transform: translateX(-3px);
    }

    hr {
      border: 0.5px solid var(--border);
      margin: 1.2rem 0;
    }

    /* Toast */
    .admin-toast {
      position: fixed;
      bottom: 30px;
      left: 30px;
      background: var(--accent-gradient);
      color: var(--bg-primary);
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(80px);
      transition: 0.3s;
      z-index: 1000;
      font-weight: 500;
    }

    .admin-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .loading-spinner {
      text-align: center;
      padding: 1.5rem;
      color: var(--accent);
    }

    /* Theme Variables */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #fffbf5;
      --bg-gradient: linear-gradient(135deg, #fff9f0 0%, #ffffff 100%);
      --text-primary: #2e2a28;
      --text-secondary: #6b5c4f;
      --accent: #d4af37;
      --accent-dark: #b4942c;
      --accent-gradient: linear-gradient(135deg, #d4af37 0%, #f5d742 50%, #d4af37 100%);
      --border: rgba(212, 175, 55, 0.2);
      --card-gradient: linear-gradient(145deg, #ffffff 0%, #fffaf2 100%);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 5px 20px rgba(212, 175, 55, 0.1);
      --shadow-lg: 0 10px 30px rgba(212, 175, 55, 0.15);
      --shadow-xl: 0 20px 40px rgba(212, 175, 55, 0.2);
      --input-bg: #ffffff;
      --hover-bg: rgba(212, 175, 55, 0.05);
    }

    body.dark {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-gradient: linear-gradient(135deg, #0a0a0a 0%, #141414 100%);
      --text-primary: #f5f5f5;
      --text-secondary: #b8b8b8;
      --accent: #ffd700;
      --accent-dark: #e6c300;
      --accent-gradient: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
      --border: rgba(255, 215, 0, 0.2);
      --card-gradient: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 5px 20px rgba(255, 215, 0, 0.1);
      --shadow-lg: 0 10px 30px rgba(255, 215, 0, 0.15);
      --shadow-xl: 0 20px 40px rgba(255, 215, 0, 0.2);
      --input-bg: #2a2a2a;
      --hover-bg: rgba(255, 215, 0, 0.1);
    }

    /* Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--accent);
      background: var(--bg-primary);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      z-index: 1000;
    }

    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    @media (max-width: 480px) {
      .admin-wrapper {
        padding: 1.2rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .theme-toggle {
        top: 15px;
        right: 15px;
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Theme Toggle Button -->
  <div class="theme-toggle" id="themeToggle">
    <i class="fas fa-sun"></i>
    <i class="fas fa-moon" style="display: none;"></i>
  </div>

  <div class="admin-wrapper" id="adminWrapper">
    <!-- GATE PANEL -->
    <div id="gatePanel" class="gate">
      <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 1rem;"></i>
      <h2>Espace propriétaire</h2>
      <div class="password-input">
        <input type="password" id="passwordInput" placeholder="Mot de passe" value="">
        <button id="unlockBtn"><i class="fas fa-arrow-right"></i></button>
      </div>
      <div class="hint">🔐 Mot de passe: <strong>sillage</strong></div>
      <a href="index.html" id="backToShopLink" class="back-link"><i class="fas fa-arrow-left"></i> Retour à la
        boutique</a>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display: none;">
      <h1>
        <i class="fas fa-pen-nib"></i> Sillage · Gérer les produits
        <span style="flex:1; text-align: right; font-size: 0.7rem; opacity:0.7;" id="loggedInAs"></span>
      </h1>

      <div class="two-column">
        <!-- ADD PRODUCT FORM -->
        <div class="form-panel">
          <h2><i class="fas fa-plus-circle"></i> Ajouter un parfum</h2>
          <div class="input-group">
            <label>Nom du produit</label>
            <input type="text" id="productName" placeholder="ex. Bois d'Argent" autocomplete="off">
          </div>
          <div class="input-group">
            <label>Marque / Maison</label>
            <input type="text" id="productBrand" placeholder="PHYSALIS / NAEVE ...">
          </div>
          <div class="input-group">
            <label>Prix (TND)</label>
            <input type="number" id="productPrice" step="0.001" min="0" value="89.000">
          </div>

          <!-- Icon Selection -->
          <div class="input-group">
            <label>Icône (si pas d'image)</label>
            <div class="icon-selector" id="iconSelector">
              <div class="icon-option selected" data-icon="fa-leaf"><i class="fas fa-leaf"></i> Feuille</div>
              <div class="icon-option" data-icon="fa-plant-wilt"><i class="fas fa-plant-wilt"></i> Plante</div>
              <div class="icon-option" data-icon="fa-tree"><i class="fas fa-tree"></i> Bois</div>
              <div class="icon-option" data-icon="fa-flower"><i class="fas fa-flower"></i> Fleur</div>
              <div class="icon-option" data-icon="fa-cloud-moon"><i class="fas fa-cloud-moon"></i> Fumée</div>
              <div class="icon-option" data-icon="fa-crown"><i class="fas fa-crown"></i> Prestige</div>
            </div>
          </div>

          <!-- Image Upload -->
          <div class="input-group">
            <label>Image du produit</label>
            <div class="file-input-area" id="fileInputArea">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Cliquez pour sélectionner une image</p>
              <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>
            <div id="imagePreview" style="display: none;">
              <img id="previewImg" src="#" alt="aperçu">
              <span id="previewFilename"></span>
              <i class="fas fa-times" id="clearPreview"
                style="margin-left: auto; cursor:pointer; color:var(--accent);"></i>
            </div>
          </div>

          <button class="btn-primary" id="addProductBtn"><i class="fas fa-gem"></i> Enregistrer le produit</button>
          <hr>
          <p style="font-size:0.7rem; color:var(--text-secondary);"><i class="fas fa-info-circle"></i> Les images sont
            stockées en Base64</p>
        </div>

        <!-- PRODUCTS LIST -->
        <div class="list-panel">
          <h2><i class="fas fa-box-open"></i> Parfums existants</h2>
          <div id="loadingAdmin" class="loading-spinner" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Chargement...
          </div>
          <div id="adminProductListContainer"></div>
        </div>
      </div>
      <div style="margin-top: 1.5rem; text-align: right;">
        <button id="logoutBtn" class="logout-btn"
          style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.85rem;">
          <i class="fas fa-sign-out-alt"></i> Se déconnecter
        </button>
      </div>
    </div>
  </div>

  <div id="adminToast" class="admin-toast">✨ Enregistré</div>

  <script>
    (function () {
      // Supabase Config
      const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      // Theme Switcher
      function initTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
          document.body.classList.add('dark');
          const sun = document.querySelector('#themeToggle .fa-sun');
          const moon = document.querySelector('#themeToggle .fa-moon');
          if (sun) sun.style.display = 'none';
          if (moon) moon.style.display = 'inline-block';
        }
      }

      function toggleTheme() {
        if (document.body.classList.contains('dark')) {
          document.body.classList.remove('dark');
          localStorage.setItem('theme', 'light');
          const sun = document.querySelector('#themeToggle .fa-sun');
          const moon = document.querySelector('#themeToggle .fa-moon');
          if (sun) sun.style.display = 'inline-block';
          if (moon) moon.style.display = 'none';
        } else {
          document.body.classList.add('dark');
          localStorage.setItem('theme', 'dark');
          const sun = document.querySelector('#themeToggle .fa-sun');
          const moon = document.querySelector('#themeToggle .fa-moon');
          if (sun) sun.style.display = 'none';
          if (moon) moon.style.display = 'inline-block';
        }
      }

      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
      initTheme();

      // Password Gate
      const GATE_PASSWORD = 'sillage';
      const gatePanel = document.getElementById('gatePanel');
      const adminPanel = document.getElementById('adminPanel');
      const unlockBtn = document.getElementById('unlockBtn');
      const passwordInput = document.getElementById('passwordInput');
      const backLink = document.getElementById('backToShopLink');
      const logoutBtn = document.getElementById('logoutBtn');
      const loggedInSpan = document.getElementById('loggedInAs');
      const loadingAdmin = document.getElementById('loadingAdmin');
      const adminListContainer = document.getElementById('adminProductListContainer');

      // Form Elements
      const productName = document.getElementById('productName');
      const productBrand = document.getElementById('productBrand');
      const productPrice = document.getElementById('productPrice');
      const iconOptions = document.querySelectorAll('.icon-option');
      let selectedIcon = 'fa-leaf';

      // Image Upload
      const fileInput = document.getElementById('imageUpload');
      const fileArea = document.getElementById('fileInputArea');
      const imagePreview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      const previewFilename = document.getElementById('previewFilename');
      const clearPreview = document.getElementById('clearPreview');
      let uploadedImageBase64 = null;

      function showAdminToast(msg) {
        const toast = document.getElementById('adminToast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      // Load Products
      async function loadAdminProducts() {
        try {
          adminListContainer.innerHTML = '';
          loadingAdmin.style.display = 'block';

          const { data, error } = await supabase
            .from('products')
            .select('*')
            .order('created_at', { ascending: true });

          if (error) throw error;

          loadingAdmin.style.display = 'none';

          if (!data || data.length === 0) {
            adminListContainer.innerHTML = '<div class="empty-list">✨ Aucun parfum. Ajoutez le premier.</div>';
            return;
          }

          let html = '';
          data.forEach(prod => {
            const priceStr = parseFloat(prod.price).toFixed(3).replace('.', ',');
            const iconOrImage = prod.image
              ? `<img src="${prod.image}" alt="${prod.name}">`
              : `<i class="fas ${prod.icon || 'fa-leaf'}"></i>`;

            html += `
              <div class="admin-product-item" data-id="${prod.id}">
                <div class="admin-product-img">${iconOrImage}</div>
                <div class="admin-product-info">
                  <div class="admin-product-title">${prod.name}</div>
                  <div class="admin-product-brand">${prod.brand}</div>
                  <div class="admin-product-price">${priceStr} TND</div>
                </div>
                <button class="delete-btn" data-id="${prod.id}" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
              </div>
            `;
          });
          adminListContainer.innerHTML = html;
        } catch (error) {
          console.error('Erreur chargement:', error);
          loadingAdmin.style.display = 'none';
          adminListContainer.innerHTML = '<div class="empty-list">❌ Erreur de chargement</div>';
          showAdminToast('❌ Erreur chargement produits');
        }
      }

      // Add Product
      async function addProduct() {
        const name = productName.value.trim();
        const brand = productBrand.value.trim();
        const price = parseFloat(productPrice.value);

        if (!name || !brand || isNaN(price) || price <= 0) {
          showAdminToast('❌ Nom, marque et prix valides requis');
          return;
        }

        try {
          const newProduct = {
            name: name,
            brand: brand,
            price: price,
            icon: selectedIcon,
            image: uploadedImageBase64 || null
          };

          const { error } = await supabase
            .from('products')
            .insert([newProduct]);

          if (error) throw error;

          // Reset form
          productName.value = '';
          productBrand.value = '';
          productPrice.value = '89.000';

          iconOptions.forEach(o => o.classList.remove('selected'));
          document.querySelector('.icon-option[data-icon="fa-leaf"]').classList.add('selected');
          selectedIcon = 'fa-leaf';

          uploadedImageBase64 = null;
          imagePreview.style.display = 'none';
          fileInput.value = '';

          showAdminToast('✅ Produit ajouté');
          loadAdminProducts();
        } catch (error) {
          console.error('Erreur ajout:', error);
          showAdminToast('❌ Erreur lors de l\'ajout');
        }
      }

      // Delete Product
      async function deleteProduct(id) {
        if (!confirm('Supprimer ce produit ?')) return;

        try {
          const { error } = await supabase
            .from('products')
            .delete()
            .match({ id });

          if (error) throw error;

          showAdminToast('🗑️ Produit supprimé');
          loadAdminProducts();
        } catch (error) {
          console.error('Erreur suppression:', error);
          showAdminToast('❌ Erreur lors de la suppression');
        }
      }

      // Event Listeners
      unlockBtn.addEventListener('click', () => {
        if (passwordInput.value === GATE_PASSWORD) {
          gatePanel.style.display = 'none';
          adminPanel.style.display = 'block';
          loggedInSpan.textContent = '⚡ propriétaire · ' + new Date().toLocaleDateString('fr-FR');
          loadAdminProducts();
        } else {
          alert('❌ Mot de passe incorrect');
        }
      });

      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') unlockBtn.click();
      });

      logoutBtn.addEventListener('click', () => {
        adminPanel.style.display = 'none';
        gatePanel.style.display = 'block';
        passwordInput.value = '';
      });

      backLink.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = 'index.html';
      });

      // Icon selector
      iconOptions.forEach(opt => {
        opt.addEventListener('click', () => {
          iconOptions.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          selectedIcon = opt.dataset.icon;
        });
      });

      // Image upload
      fileArea.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          uploadedImageBase64 = ev.target.result;
          previewImg.src = ev.target.result;
          previewFilename.textContent = file.name.length > 20 ? file.name.substr(0, 18) + '…' : file.name;
          imagePreview.style.display = 'flex';
        };
        reader.readAsDataURL(file);
      });

      clearPreview.addEventListener('click', () => {
        uploadedImageBase64 = null;
        imagePreview.style.display = 'none';
        fileInput.value = '';
      });

      document.getElementById('addProductBtn').addEventListener('click', addProduct);

      adminListContainer.addEventListener('click', (e) => {
        const deleteBtn = e.target.closest('.delete-btn');
        if (deleteBtn) {
          const id = deleteBtn.dataset.id;
          deleteProduct(id);
        }
      });
    })();
  </script>
</body>

</html>
