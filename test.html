<!DOCTYPE html>
<html>
<head>
    <title>Test Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Auth</h1>
    
    <div id="status">Checking connection...</div>
    
    <hr>
    
    <h2>Sign Up</h2>
    <input type="email" id="signupEmail" placeholder="Email"><br>
    <input type="password" id="signupPassword" placeholder="Password"><br>
    <button onclick="testSignUp()">Sign Up</button>
    
    <hr>
    
    <h2>Sign In</h2>
    <input type="email" id="signinEmail" placeholder="Email"><br>
    <input type="password" id="signinPassword" placeholder="Password"><br>
    <button onclick="testSignIn()">Sign In</button>
    
    <hr>
    
    <div id="result"></div>

    <script>
        // REPLACE WITH YOUR ACTUAL VALUES
        const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';
        
        console.log('Initializing Supabase with:', SUPABASE_URL);
        
        // Create supabase client - only declare once!
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Test connection
        async function testConnection() {
            try {
                const { data, error } = await supabase.auth.getSession();
                document.getElementById('status').innerHTML = '✅ Connected to Supabase!';
                document.getElementById('status').style.color = 'green';
                console.log('Connection test result:', { data, error });
            } catch (e) {
                document.getElementById('status').innerHTML = '❌ Connection failed: ' + e.message;
                document.getElementById('status').style.color = 'red';
                console.error('Connection error:', e);
            }
        }
        
        testConnection();
        
        // Test Sign Up
        async function testSignUp() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            if (!email || !password) {
                alert('Enter email and password');
                return;
            }
            
            document.getElementById('result').innerHTML = 'Trying to sign up...';
            
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (error) {
                    document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
                    document.getElementById('result').style.color = 'red';
                    console.error('Sign up error:', error);
                } else {
                    document.getElementById('result').innerHTML = '✅ Success! User created. Check Supabase dashboard.';
                    document.getElementById('result').style.color = 'green';
                    console.log('Sign up success:', data);
                }
            } catch (e) {
                document.getElementById('result').innerHTML = '❌ Exception: ' + e.message;
                document.getElementById('result').style.color = 'red';
                console.error('Sign up exception:', e);
            }
        }
        
        // Test Sign In
        async function testSignIn() {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;
            
            if (!email || !password) {
                alert('Enter email and password');
                return;
            }
            
            document.getElementById('result').innerHTML = 'Trying to sign in...';
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
                    document.getElementById('result').style.color = 'red';
                    console.error('Sign in error:', error);
                } else {
                    document.getElementById('result').innerHTML = '✅ Success! User logged in';
                    document.getElementById('result').style.color = 'green';
                    console.log('Sign in success:', data);
                }
            } catch (e) {
                document.getElementById('result').innerHTML = '❌ Exception: ' + e.message;
                document.getElementById('result').style.color = 'red';
                console.error('Sign in exception:', e);
            }
        }
    </script>
</body>
</html>
