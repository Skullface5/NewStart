<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sillage | Connexion</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            padding-top: 80px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        body.dark header {
            background: rgba(10, 10, 10, 0.95);
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0.8rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            font-size: 1.8rem;
            color: var(--accent);
        }

        .logo h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 350;
            color: var(--text-primary);
        }

        .right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.4rem;
            color: var(--accent);
            transition: color 0.2s;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 0.65rem;
            font-weight: 600;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--accent);
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(15deg);
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.3rem;
            display: flex;
            align-items: center;
        }

        .menu-toggle:hover {
            color: var(--accent);
        }

        /* Navigation Dropdown */
        .nav-links {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 100%;
            right: 1rem;
            width: 240px;
            background: var(--bg-primary);
            backdrop-filter: blur(10px);
            gap: 0;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            z-index: 101;
            border-radius: 16px;
        }

        .nav-links.active {
            max-height: 380px;
            opacity: 1;
            padding: 0.5rem 0;
        }

        .nav-links a {
            padding: 0.8rem 1.2rem;
            width: 100%;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .nav-links a:last-child {
            border-bottom: none;
        }

        .nav-links a:hover {
            background: var(--hover-bg);
            color: var(--accent);
            padding-left: 1.5rem;
        }

        /* Language Dropdown inside menu */
        .lang-menu {
            border-bottom: 1px solid var(--border);
        }

        .lang-current {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: none;
            border: none;
            padding: 0.8rem 1.2rem;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-current:hover {
            background: var(--hover-bg);
            color: var(--accent);
        }

        .lang-current i {
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .lang-menu.active .lang-current i {
            transform: rotate(180deg);
        }

        .lang-options {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: var(--bg-primary);
        }

        .lang-menu.active .lang-options {
            max-height: 140px;
        }

        .lang-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.6rem 1.2rem 0.6rem 2rem;
            background: none;
            border: none;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-option:hover {
            background: var(--hover-bg);
            color: var(--accent);
        }

        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-overlay.active {
            display: block;
            opacity: 1;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            .header-flex {
                padding: 0.6rem 1rem;
            }

            .logo h1 {
                font-size: 1.2rem;
            }

            .logo i {
                font-size: 1.5rem;
            }

            .right-group {
                gap: 8px;
            }

            .nav-links {
                width: 200px;
                right: 0.5rem;
            }
        }

        /* Cart Sidebar */
        .cart-overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .cart-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 360px;
            max-width: 85vw;
            height: 100vh;
            background: var(--bg-primary);
            backdrop-filter: blur(14px);
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.2);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease-out;
            z-index: 250;
            border-left: 1px solid var(--border);
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }

        .cart-header h3 {
            font-size: 1.1rem;
            font-weight: 350;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-primary);
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .close-cart:hover {
            color: var(--accent);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 0.8rem;
        }

        .cart-item-icon {
            background: var(--bg-secondary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-icon i {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .cart-item-info {
            flex: 2;
        }

        .cart-item-title {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .cart-item-price {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }

        .quantity-btn {
            background: var(--bg-secondary);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .quantity-btn:hover {
            background: var(--accent);
            color: white;
        }

        .quantity-value {
            font-weight: 500;
            min-width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 5px;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
            margin-top: 0.5rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.8rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: var(--bg-primary);
            border: none;
            padding: 0.8rem;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .empty-cart-message {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--accent-gradient);
            color: var(--bg-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.2s;
            z-index: 300;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Auth Form */
        .auth-wrapper {
            max-width: 450px;
            width: 100%;
            background: var(--card-gradient);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            margin: 1rem auto;
            padding: 2rem;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-center {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-center i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .logo-center h1 {
            font-size: 1.6rem;
            font-weight: 350;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-primary);
        }

        .tab-container {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            color: var(--accent);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--accent);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn-primary {
            background: var(--accent-gradient);
            border: none;
            color: var(--bg-primary);
            padding: 0.8rem;
            border-radius: 50px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 50px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(44, 104, 44, 0.1);
            color: #2c682c;
            border: 1px solid #2c682c;
        }

        .message.error {
            background: rgba(179, 69, 69, 0.1);
            color: #b34545;
            border: 1px solid #b34545;
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.2rem 0;
            color: var(--text-secondary);
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .separator span {
            padding: 0 10px;
            font-size: 0.7rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Theme Variables */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #fffbf5;
            --bg-gradient: linear-gradient(135deg, #fff9f0 0%, #ffffff 100%);
            --text-primary: #2e2a28;
            --text-secondary: #6b5c4f;
            --accent: #d4af37;
            --accent-dark: #b4942c;
            --accent-gradient: linear-gradient(135deg, #d4af37 0%, #f5d742 50%, #d4af37 100%);
            --border: rgba(212, 175, 55, 0.2);
            --card-gradient: linear-gradient(145deg, #ffffff 0%, #fffaf2 100%);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 5px 20px rgba(212, 175, 55, 0.1);
            --shadow-lg: 0 15px 35px rgba(212, 175, 55, 0.12);
            --input-bg: #ffffff;
            --hover-bg: rgba(212, 175, 55, 0.05);
        }

        body.dark {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-gradient: linear-gradient(135deg, #0a0a0a 0%, #141414 100%);
            --text-primary: #f5f5f5;
            --text-secondary: #b8b8b8;
            --accent: #ffd700;
            --accent-dark: #e6c300;
            --accent-gradient: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            --border: rgba(255, 215, 0, 0.2);
            --card-gradient: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            --shadow-md: 0 5px 20px rgba(255, 215, 0, 0.1);
            --shadow-lg: 0 15px 35px rgba(255, 215, 0, 0.12);
            --input-bg: #2a2a2a;
            --hover-bg: rgba(255, 215, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="menuOverlay" class="menu-overlay"></div>
    <div id="toast" class="notification">✨ Article ajouté</div>

    <!-- Cart Sidebar -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <aside id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3><i class="fas fa-bag-shopping"></i> Votre panier</h3>
            <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItemsContainer" class="cart-items">
            <div class="empty-cart-message">Votre panier est vide.</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotalPrice">0,000 TND</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">PAIEMENT <i class="fas fa-arrow-right"></i></button>
        </div>
    </aside>

    <!-- Header -->
    <header>
        <div class="header-flex">
            <a href="index.html" class="logo" style="text-decoration: none;">
                <i class="fas fa-spa"></i>
                <h1>SILLAGE</h1>
            </a>
            <div class="right-group">
                <div class="cart-icon" id="cartToggle">
                    <i class="fas fa-bag-shopping"></i>
                    <span id="cartCount" class="cart-count">0</span>
                </div>
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon" style="display: none;"></i>
                </div>
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">ACCUEIL</a>
                <a href="#">COLLECTION</a>
                <a href="#">EXCLUSIVITÉS</a>
                <a href="#">COFFRETS</a>
                <div class="lang-menu" id="langMenu">
                    <button class="lang-current">
                        <span>FRANÇAIS</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="lang-options">
                        <button class="lang-option" data-lang="fr">🇫🇷 Français</button>
                        <button class="lang-option" data-lang="en">🇬🇧 English</button>
                        <button class="lang-option" data-lang="ar">🇸🇦 العربية</button>
                    </div>
                </div>
                <a href="profile.html" id="profileLink">Mon Profil</a>
            </div>
        </div>
    </header>

    <!-- Auth Form -->
    <div class="auth-wrapper">
        <div class="logo-center">
            <i class="fas fa-spa"></i>
            <h1>SILLAGE</h1>
        </div>

        <div class="tab-container">
            <div class="tab active" id="signinTab" onclick="switchTab('signin')">CONNEXION</div>
            <div class="tab" id="signupTab" onclick="switchTab('signup')">INSCRIPTION</div>
        </div>

        <form id="signinForm" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signinEmail" placeholder="votre@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signinPassword" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signinBtn">SE CONNECTER</button>
        </form>

        <form id="signupForm" style="display: none;" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signupEmail" placeholder="votre@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signupPassword" placeholder="Minimum 6 caractères" required
                        minlength="6">
                </div>
            </div>
            <div class="form-group">
                <label>Confirmer</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirmer" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">CRÉER MON COMPTE</button>
        </form>

        <div id="messageBox" class="message"></div>
        <div class="separator"><span>ou</span></div>
        <a href="index.html" class="back-link"
            style="display: block; text-align: center; color: var(--accent); text-decoration: none; font-size: 0.85rem;">←
            Retour à la boutique</a>
    </div>

    <script>
        // ========== LANGUAGE MENU ==========
        const langMenu = document.getElementById('langMenu');
        if (langMenu) {
            const langCurrentBtn = langMenu.querySelector('.lang-current');
            langCurrentBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                langMenu.classList.toggle('active');
            });
            langMenu.querySelectorAll('.lang-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    langMenu.classList.remove('active');
                });
            });
            document.addEventListener('click', () => langMenu.classList.remove('active'));
        }

        // ========== MENU TOGGLE ==========
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            navLinks.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            if (navLinks.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

        if (menuToggle) menuToggle.addEventListener('click', toggleMenu);
        if (menuOverlay) menuOverlay.addEventListener('click', toggleMenu);
        if (navLinks) {
            navLinks.querySelectorAll('a, .lang-current, .lang-option').forEach(el => {
                el.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    menuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                });
            });
        }

        // ========== CART FUNCTIONS ==========
        let cart = JSON.parse(localStorage.getItem('sillage_cart')) || [];

        const cartSidebar = document.getElementById('cartSidebar');
        const cartOverlay = document.getElementById('cartOverlay');
        const cartToggle = document.getElementById('cartToggle');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartCountSpan = document.getElementById('cartCount');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartTotalSpan = document.getElementById('cartTotalPrice');
        const toast = document.getElementById('toast');
        const checkoutBtn = document.getElementById('checkoutBtn');

        function formatPrice(price) {
            return parseFloat(price).toFixed(3).replace('.', ',') + ' TND';
        }

        function updateCartCount() {
            const totalItems = cart.reduce((acc, item) => acc + (item.quantity || 1), 0);
            if (cartCountSpan) cartCountSpan.textContent = totalItems;
        }

        function renderCart() {
            if (!cartItemsContainer) return;
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart-message">Votre panier est vide.</div>';
                if (cartTotalSpan) cartTotalSpan.textContent = '0,000 TND';
                return;
            }
            let itemsHtml = '';
            let total = 0;
            cart.forEach(item => {
                const subtotal = item.price * (item.quantity || 1);
                total += subtotal;
                itemsHtml += `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="cart-item-icon"><i class="fas ${item.icon || 'fa-leaf'}"></i></div>
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${formatPrice(item.price)}</div>
                            <div class="cart-item-quantity">
                                <button class="quantity-btn" data-id="${item.id}" data-action="decrease">-</button>
                                <span class="quantity-value">${item.quantity || 1}</span>
                                <button class="quantity-btn" data-id="${item.id}" data-action="increase">+</button>
                            </div>
                        </div>
                        <button class="cart-item-remove" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });
            cartItemsContainer.innerHTML = itemsHtml;
            if (cartTotalSpan) cartTotalSpan.textContent = formatPrice(total);
        }

        function saveCart() {
            localStorage.setItem('sillage_cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        function showToast(msg) {
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            showToast('🗑️ Article retiré');
        }

        function updateQuantity(id, action) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            if (action === 'increase') {
                item.quantity = (item.quantity || 1) + 1;
            } else if (action === 'decrease') {
                if (item.quantity > 1) {
                    item.quantity -= 1;
                } else {
                    removeFromCart(id);
                    return;
                }
            }
            saveCart();
        }

        function openCart() {
            if (cartSidebar) cartSidebar.classList.add('open');
            if (cartOverlay) cartOverlay.classList.add('active');
            if (navLinks.classList.contains('active')) toggleMenu();
        }

        function closeCart() {
            if (cartSidebar) cartSidebar.classList.remove('open');
            if (cartOverlay) cartOverlay.classList.remove('active');
        }

        if (cartToggle) cartToggle.addEventListener('click', openCart);
        if (closeCartBtn) closeCartBtn.addEventListener('click', closeCart);
        if (cartOverlay) cartOverlay.addEventListener('click', closeCart);
        if (cartItemsContainer) {
            cartItemsContainer.addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.cart-item-remove');
                if (removeBtn) removeFromCart(removeBtn.dataset.id);
                const qtyBtn = e.target.closest('.quantity-btn');
                if (qtyBtn) updateQuantity(qtyBtn.dataset.id, qtyBtn.dataset.action);
            });
        }

        // Checkout redirect
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', () => {
                if (cart.length === 0) {
                    showToast('🛒 Votre panier est vide');
                } else {
                    window.location.href = 'index.html';
                }
            });
        }

        // ========== AUTH FUNCTIONS ==========
        const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const signinForm = document.getElementById('signinForm');
        const signupForm = document.getElementById('signupForm');
        const signinBtn = document.getElementById('signinBtn');
        const signupBtn = document.getElementById('signupBtn');
        const messageBox = document.getElementById('messageBox');

        window.switchTab = function (tab) {
            const signinTab = document.getElementById('signinTab');
            const signupTab = document.getElementById('signupTab');
            if (tab === 'signin') {
                signinTab.classList.add('active');
                signupTab.classList.remove('active');
                signinForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                signupTab.classList.add('active');
                signinTab.classList.remove('active');
                signupForm.style.display = 'block';
                signinForm.style.display = 'none';
            }
            messageBox.style.display = 'none';
        };

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message ${type} show`;
            if (type === 'success') {
                setTimeout(() => {
                    messageBox.style.display = 'none';
                    messageBox.className = 'message';
                }, 3000);
            }
        }

        window.handleSignUp = async function (event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirmPassword').value;

            if (password.length < 6) {
                showMessage('❌ Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }
            if (password !== confirm) {
                showMessage('❌ Les mots de passe ne correspondent pas', 'error');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerHTML = '<span class="loading-spinner"></span> Création...';

            try {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    if (error.message.includes('already registered')) {
                        showMessage('❌ Cet email est déjà utilisé', 'error');
                    } else {
                        showMessage('❌ ' + error.message, 'error');
                    }
                } else {
                    showMessage('✅ Compte créé! Bienvenue chez Sillage ✨', 'success');
                    document.getElementById('signupEmail').value = '';
                    document.getElementById('signupPassword').value = '';
                    document.getElementById('signupConfirmPassword').value = '';
                    setTimeout(() => window.switchTab('signin'), 2000);
                }
            } catch (err) {
                showMessage('❌ Une erreur est survenue', 'error');
            } finally {
                signupBtn.disabled = false;
                signupBtn.innerHTML = 'CRÉER MON COMPTE';
            }
        };

        window.handleSignIn = async function (event) {
            event.preventDefault();
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            signinBtn.disabled = true;
            signinBtn.innerHTML = '<span class="loading-spinner"></span> Connexion...';

            try {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showMessage('❌ Email ou mot de passe incorrect', 'error');
                } else {
                    showMessage('✅ Connexion réussie! Redirection...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                }
            } catch (err) {
                showMessage('❌ Une erreur est survenue', 'error');
            } finally {
                signinBtn.disabled = false;
                signinBtn.innerHTML = 'SE CONNECTER';
            }
        };

        async function checkLoggedIn() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s';
                setTimeout(() => window.location.href = 'index.html', 500);
            }
        }
        checkLoggedIn();

        // ========== THEME SWITCHER ==========
        function initTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') {
                document.body.classList.add('dark');
                const sun = document.querySelector('#themeToggle .fa-sun');
                const moon = document.querySelector('#themeToggle .fa-moon');
                if (sun) sun.style.display = 'none';
                if (moon) moon.style.display = 'inline-block';
            }
        }

        function toggleTheme() {
            if (document.body.classList.contains('dark')) {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                const sun = document.querySelector('#themeToggle .fa-sun');
                const moon = document.querySelector('#themeToggle .fa-moon');
                if (sun) sun.style.display = 'inline-block';
                if (moon) moon.style.display = 'none';
            } else {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                const sun = document.querySelector('#themeToggle .fa-sun');
                const moon = document.querySelector('#themeToggle .fa-moon');
                if (sun) sun.style.display = 'none';
                if (moon) moon.style.display = 'inline-block';
            }
        }

        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
        initTheme();
        saveCart();
    </script>
</body>

</html>
