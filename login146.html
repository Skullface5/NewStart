<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sillage | Connexion</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #faf7f2;
            color: #2e2a28;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(182, 152, 122, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(182, 152, 122, 0.05) 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite;
        }

        @keyframes backgroundPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .auth-wrapper {
            max-width: 450px;
            width: 100%;
            background: #ffffffd9;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 42px;
            box-shadow: 0 30px 60px -20px rgba(98, 78, 62, 0.3);
            border: 1px solid #ede3da;
            overflow: hidden;
            padding: 2.5rem 2rem;
            position: relative;
            animation: slideUp 0.6s ease-out;
            transform-origin: center;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo i {
            font-size: 3rem;
            color: #b6987a;
            margin-bottom: 0.5rem;
            animation: rotateIn 0.8s ease-out;
        }

        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-180deg) scale(0.3);
            }

            to {
                opacity: 1;
                transform: rotate(0) scale(1);
            }
        }

        .logo h1 {
            font-weight: 350;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #3f3730;
            animation: slideInFromLeft 0.8s ease-out 0.1s both;
        }

        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .tab-container {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid #ede3da;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            color: #9c8e82;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(182, 152, 122, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .tab:hover::before {
            width: 300px;
            height: 300px;
        }

        .tab.active {
            color: #b6987a;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #b6987a;
            animation: slideInUnderline 0.3s ease-out;
        }

        @keyframes slideInUnderline {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
            animation: slideInFromRight 0.8s ease-out;
            animation-fill-mode: both;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.4s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.5s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes slideInFromRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #937f6e;
            margin-bottom: 0.4rem;
            transition: color 0.3s;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.2rem;
            color: #b6987a;
            font-size: 1rem;
            transition: transform 0.3s, color 0.3s;
            z-index: 1;
        }

        input {
            width: 100%;
            background: white;
            border: 1px solid #dbcec2;
            border-radius: 60px;
            padding: 1rem 1.4rem 1rem 3rem;
            font-size: 0.95rem;
            color: #2c2824;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: #b6987a;
            box-shadow: 0 0 0 4px rgba(182, 152, 122, 0.1);
            transform: translateY(-1px);
        }

        input:focus+i {
            transform: scale(1.1) translateX(-2px);
            color: #8b6f5a;
        }

        .btn-primary {
            background: #b6987a;
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 60px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out 0.7s both;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary:hover {
            background: #a07d63;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -8px rgba(160, 125, 99, 0.4);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .btn-primary:disabled {
            background: #d6c9bf;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-primary:disabled::before {
            display: none;
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 40px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-5px);
            }

            40% {
                transform: translateX(5px);
            }

            60% {
                transform: translateX(-3px);
            }

            80% {
                transform: translateX(3px);
            }
        }

        .message.show {
            display: block;
            animation: slideInMessage 0.4s ease-out;
        }

        @keyframes slideInMessage {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #e2f0e6;
            color: #2c682c;
            border: 1px solid #b8d9b8;
        }

        .message.error {
            background: #ffe6e6;
            color: #b34545;
            border: 1px solid #ffb3b3;
        }

        .message.info {
            background: #e6f0ff;
            color: #2c5c8c;
            border: 1px solid #b3d1ff;
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #9c8e82;
            animation: fadeIn 0.8s ease-out 0.8s both;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ede3da;
            transition: all 0.3s;
        }

        .separator:hover::before,
        .separator:hover::after {
            border-color: #b6987a;
        }

        .separator span {
            padding: 0 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .separator:hover span {
            color: #b6987a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #b6987a;
            text-decoration: none;
            font-size: 0.9rem;
            animation: fadeIn 0.8s ease-out 0.9s both;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .back-link i {
            margin-right: 5px;
            transition: transform 0.3s;
        }

        .back-link:hover {
            color: #8b6f5a;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Floating animation for the logo icon */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-3px) rotate(2deg);
            }

            75% {
                transform: translateY(3px) rotate(-2deg);
            }
        }

        .logo i {
            animation: float 4s ease-in-out infinite, rotateIn 0.8s ease-out;
        }

        /* Ripple effect for inputs */
        .input-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #b6987a;
            transform: translateX(-50%);
            transition: width 0.3s;
        }

        .input-wrapper:focus-within::after {
            width: 80%;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="logo">
            <i class="fas fa-spa"></i>
            <h1>SILLAGE</h1>
        </div>

        <!-- Tabs -->
        <div class="tab-container">
            <div class="tab active" id="signinTab" onclick="switchTab('signin')">CONNEXION</div>
            <div class="tab" id="signupTab" onclick="switchTab('signup')">INSCRIPTION</div>
        </div>

        <!-- Sign In Form -->
        <form id="signinForm" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signinEmail" placeholder="votre@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signinPassword" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signinBtn">
                <span>SE CONNECTER</span>
            </button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" style="display: none;" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signupEmail" placeholder="votre@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signupPassword" placeholder="Minimum 6 caractères" required
                        minlength="6">
                </div>
            </div>
            <div class="form-group">
                <label>Confirmer</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirmer" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">
                <span>CRÉER MON COMPTE</span>
            </button>
        </form>

        <!-- Message Display -->
        <div id="messageBox" class="message"></div>

        <!-- Separator -->
        <div class="separator">
            <span>ou</span>
        </div>

        <!-- Back to shop -->
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Retour à la boutique
        </a>
    </div>

    <script>
        // ---------- SUPABASE CONFIG ----------
        const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';

        // Use a different name to avoid any conflict
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DOM elements
        const signinTab = document.getElementById('signinTab');
        const signupTab = document.getElementById('signupTab');
        const signinForm = document.getElementById('signinForm');
        const signupForm = document.getElementById('signupForm');
        const signinBtn = document.getElementById('signinBtn');
        const signupBtn = document.getElementById('signupBtn');
        const messageBox = document.getElementById('messageBox');

        // Switch between tabs with animation
        window.switchTab = function (tab) {
            if (tab === 'signin') {
                signinTab.classList.add('active');
                signupTab.classList.remove('active');

                // Animate form switch
                signinForm.style.animation = 'slideInFromRight 0.5s ease-out';
                signinForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                signupTab.classList.add('active');
                signinTab.classList.remove('active');

                // Animate form switch
                signupForm.style.animation = 'slideInFromRight 0.5s ease-out';
                signupForm.style.display = 'block';
                signinForm.style.display = 'none';
            }

            messageBox.style.display = 'none';
            messageBox.className = 'message';
        }

        // Show message with animation
        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message ${type} show`;

            // Auto hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageBox.style.display = 'none';
                    messageBox.className = 'message';
                }, 3000);
            }
        }

        // Handle Sign Up
        window.handleSignUp = async function (event) {
            event.preventDefault();

            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirmPassword').value;

            // Check password length
            if (password.length < 6) {
                showMessage('❌ Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            // Check passwords match
            if (password !== confirm) {
                showMessage('❌ Les mots de passe ne correspondent pas', 'error');
                return;
            }

            // Show loading
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<span class="loading-spinner"></span> Création...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo: window.location.origin + '/index.html'
                    }
                });

                if (error) {
                    if (error.message.includes('already registered')) {
                        showMessage('❌ Cet email est déjà utilisé', 'error');
                    } else if (error.message.includes('password')) {
                        showMessage('❌ Mot de passe trop faible: ' + error.message, 'error');
                    } else {
                        showMessage('❌ ' + error.message, 'error');
                    }

                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<span>CRÉER MON COMPTE</span>';

                } else {
                    showMessage('✅ Compte créé! Bienvenue chez Sillage ✨', 'success');

                    document.getElementById('signupEmail').value = '';
                    document.getElementById('signupPassword').value = '';
                    document.getElementById('signupConfirmPassword').value = '';

                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<span>CRÉER MON COMPTE</span>';

                    setTimeout(() => {
                        window.switchTab('signin');
                    }, 2000);
                }
            } catch (err) {
                console.error('Signup error:', err);
                showMessage('❌ Une erreur est survenue: ' + err.message, 'error');
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<span>CRÉER MON COMPTE</span>';
            }
        }

        // Handle Sign In
        window.handleSignIn = async function (event) {
            event.preventDefault();

            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            signinBtn.disabled = true;
            signinBtn.innerHTML = '<span class="loading-spinner"></span> Connexion...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showMessage('❌ Email ou mot de passe incorrect', 'error');
                    signinBtn.disabled = false;
                    signinBtn.innerHTML = '<span>SE CONNECTER</span>';
                } else {
                    // Success with animation before redirect
                    showMessage('✅ Connexion réussie! Redirection...', 'success');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            } catch (err) {
                console.error('Signin error:', err);
                showMessage('❌ Une erreur est survenue', 'error');
                signinBtn.disabled = false;
                signinBtn.innerHTML = '<span>SE CONNECTER</span>';
            }
        }

        // Check if user is already logged in (redirect to home)
        async function checkLoggedIn() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                // Animated redirect
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }
        }

        checkLoggedIn();
    </script>
</body>

</html>
