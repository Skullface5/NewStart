    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background with floating particles */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
      animation: backgroundPulse 8s ease-in-out infinite;
    }

    @keyframes backgroundPulse {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /* Theme Toggle Button - Top Right */
    .theme-toggle-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.4rem;
      color: var(--accent);
      background: var(--bg-primary);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    /* Floating gold particles */
    .particle {
      position: absolute;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: floatParticle 12s infinite;
    }

    @keyframes floatParticle {
      0% {
        opacity: 0;
        transform: translateY(100vh) rotate(0deg);
      }

      10% {
        opacity: 0.3;
      }

      90% {
        opacity: 0.3;
      }

      100% {
        opacity: 0;
        transform: translateY(-20vh) rotate(360deg);
      }
    }

    .auth-wrapper {
      max-width: 450px;
      width: 100%;
      background: var(--bg-primary);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
      overflow: hidden;
      padding: 2.5rem 2rem;
      position: relative;
      animation: slideUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .auth-wrapper:hover {
      transform: translateY(-5px);
      box-shadow: 0 40px 60px -20px rgba(212, 175, 55, 0.25);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo Animation */
    .logo {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.8s ease-out;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo i {
      font-size: 3.5rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: inline-block;
      animation: logoFloat 4s ease-in-out infinite, rotateIn 0.8s ease-out;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-5px) scale(1.02);
      }
    }

    @keyframes rotateIn {
      from {
        opacity: 0;
        transform: rotate(-200deg) scale(0.3);
      }

      to {
        opacity: 1;
        transform: rotate(0) scale(1);
      }
    }

    .logo h1 {
      font-weight: 350;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-primary);
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.8;
      }
    }

    /* Tabs Animation */
    .tab-container {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border);
      position: relative;
      animation: fadeInUp 0.8s ease-out 0.1s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 1rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.9rem;
      transition: background-color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      position: relative;
      overflow: hidden;
    }

    .tab::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent-gradient);
      transition: width 0.4s ease;
    }

    .tab:hover::before {
      width: 100%;
    }

    .tab.active {
      color: var(--accent);
    }

    .tab.active::before {
      width: 100%;
    }

    /* Form Group Animations */
    .form-group {
      margin-bottom: 1.5rem;
      animation: slideInFromRight 0.8s ease-out;
      animation-fill-mode: both;
    }

    .form-group:nth-child(1) {
      animation-delay: 0.2s;
    }

    .form-group:nth-child(2) {
      animation-delay: 0.3s;
    }

    .form-group:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes slideInFromRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      transition: color 0.3s, transform 0.3s;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i:first-of-type {
      position: absolute;
      left: 1.2rem;
      color: var(--accent);
      font-size: 1rem;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      z-index: 1;
      pointer-events: none;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      z-index: 2;
      background: transparent;
    }

    .password-toggle:hover {
      color: var(--accent-dark);
    }

    /* Adjust input padding to accommodate both icons */
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 1rem 3rem 1rem 3rem;
      /* Right padding increased for eye icon */
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      transition: background-color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .password-toggle:hover {
      color: var(--accent-dark);
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 1rem 1.4rem 1rem 3rem;
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      transition: background-color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-color 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
      transform: translateX(3px);
    }

    input:focus+i {
      transform: scale(1.1) translateX(-2px);
      color: var(--accent-dark);
    }

    /* Button Animation */
    .btn-primary {
      background: var(--accent-gradient);
      border: none;
      color: var(--bg-primary);
      padding: 1rem;
      border-radius: 60px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-primary:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -8px rgba(212, 175, 55, 0.5);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    /* Message Animation */
    .message {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 60px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
      animation: shakeAndSlide 0.5s ease-out;
    }

    @keyframes shakeAndSlide {
      0% {
        opacity: 0;
        transform: translateY(-10px) scale(0.95);
      }

      30% {
        transform: translateX(5px);
      }

      60% {
        transform: translateX(-3px);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.show {
      display: block;
      animation: slideInMessage 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    @keyframes slideInMessage {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.success {
      background: linear-gradient(135deg, rgba(44, 104, 44, 0.15), rgba(44, 104, 44, 0.05));
      color: #2c682c;
      border: 1px solid #2c682c;
    }

    .message.error {
      background: linear-gradient(135deg, rgba(179, 69, 69, 0.15), rgba(179, 69, 69, 0.05));
      color: #b34545;
      border: 1px solid #b34545;
    }

    /* Separator Animation */
    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.8rem 0;
      color: var(--text-secondary);
      animation: fadeIn 0.8s ease-out 0.6s both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }

    .separator:hover::before,
    .separator:hover::after {
      border-color: var(--accent);
      transform: scaleX(1.05);
    }

    .separator span {
      padding: 0 12px;
      font-size: 0.8rem;
      text-transform: uppercase;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }

    .separator:hover span {
      color: var(--accent);
      letter-spacing: 1px;
    }

    /* Back Link Animation */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      position: relative;
      animation: fadeIn 0.8s ease-out 0.7s both;
    }

    .back-link i {
      margin-right: 5px;
      transition: transform 0.3s;
    }

    .back-link:hover {
      color: var(--accent-dark);
    }

    .back-link:hover i {
      transform: translateX(-5px);
    }

    /* Loading Spinner */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Ripple effect for inputs */
    .input-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent-gradient);
      transform: translateX(-50%);
      transition: width 0.3s;
      border-radius: 2px;
    }

    .input-wrapper:focus-within::after {
      width: 80%;
    }

<body>
  <!-- Theme Toggle Button -->
  <div class="theme-toggle-wrapper">
    <div class="theme-toggle" id="themeToggle">
      <i class="fas fa-sun"></i>
      <i class="fas fa-moon" style="display: none;"></i>
    </div>
  </div>

  <!-- Floating particles -->
  <script>
    // Create floating gold particles
    for (let i = 0, n = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0 : (matchMedia('(pointer: coarse)').matches ? 6 : 30); i < n; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 6 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = Math.random() * 10 + 8 + 's';
      particle.style.opacity = Math.random() * 0.4 + 0.1;
      document.body.appendChild(particle);
    }
  </script>

  <div class="auth-wrapper">
    <div class="logo">
      <img style="width: 65px;" src="is.webp">
      <h1>Rosa Fragrances</h1>
    </div>

    <div class="login-lang" role="group" aria-label="Langue" style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;">
      <button type="button" class="lang-btn" data-login-lang="fr">FR</button>
      <span aria-hidden="true">|</span>
      <button type="button" class="lang-btn" data-login-lang="en">EN</button>
      <span aria-hidden="true">|</span>
      <button type="button" class="lang-btn" data-login-lang="ar">AR</button>
    </div>

    <!-- Tabs -->
    <div class="tab-container">
      <div class="tab active" id="signinTab" onclick="switchTab('signin')" data-tr="tabSignin">CONNEXION</div>
      <div class="tab" id="signupTab" onclick="switchTab('signup')" data-tr="tabSignup">INSCRIPTION</div>
    </div>

    <!-- Sign In Form -->
    <form id="signinForm" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label data-tr="email">Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="signinEmail" placeholder="votre@email.com" data-tr-ph="emailPh" required>
        </div>
      </div>
      <div class="form-group">
        <label data-tr="password">Mot de passe</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="signinPassword" placeholder="••••••••" required>
          <i class="fas fa-eye password-toggle" data-target="signinPassword"></i>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="signinBtn">
        <span data-tr="signinBtn">SE CONNECTER</span>
      </button>
    </form>

    <!-- Sign Up Form -->
    <form id="signupForm" style="display: none;" onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label data-tr="email">Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="votre@email.com" data-tr-ph="emailPh" required>
        </div>
      </div>
      <div class="form-group">
                    <label data-tr="fullName">Nom complet</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Votre nom" data-tr-ph="namePh" minlength="2">
                    </div>
                </div>
          <div class="form-group">
        <label data-tr="password">Mot de passe</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="signupPassword" placeholder="Minimum 6 caractères" data-tr-ph="passPh" required minlength="6">
          <i class="fas fa-eye password-toggle" data-target="signupPassword"></i>
        </div>
      </div>
      <div class="form-group">
        <label data-tr="confirm">Confirmer</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="signupConfirmPassword" placeholder="Confirmer" data-tr-ph="confirmPh" required minlength="6">
          <i class="fas fa-eye password-toggle" data-target="signupConfirmPassword"></i>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="signupBtn">
        <span data-tr="signupBtn">CRÉER MON COMPTE</span>
      </button>
    </form>

    <!-- Message Display -->
    <div id="messageBox" class="message"></div>

    <!-- Separator -->
    <div class="separator">
      <span data-tr="or">ou</span>
    </div>

    <!-- Back to shop -->
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> <span data-tr="back">Retour à la boutique</span>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app-login146.js"></script>
</body>

</html>
