<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa Fragrances | عطور فاخرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5EFE6;
    --cream-light: #FAF6F0;
    --cream-dark: #EDE3D4;
    --gold: #C9A96E;
    --gold-light: #DEC08A;
    --gold-dark: #A07840;
    --text-dark: #3A2E24;
    --text-mid: #6B5743;
    --text-light: #9C8470;
    --white: #FDFAF6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--cream-light);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
  }
