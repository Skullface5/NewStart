<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Rosa Fragrances · Parfums Existants</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
      position: relative;
      overflow-x: hidden;
      padding-top: 80px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
      animation: backgroundPulse 8s ease-in-out infinite;
    }

    @keyframes backgroundPulse {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    .particle {
      position: fixed;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: floatParticle 12s infinite;
      z-index: 0;
    }

    @keyframes floatParticle {
      0% {
        opacity: 0;
        transform: translateY(100vh) rotate(0deg);
      }

      10% {
        opacity: 0.3;
      }

      90% {
        opacity: 0.3;
      }

      100% {
        opacity: 0;
        transform: translateY(-20vh) rotate(360deg);
      }
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    body.dark header {
      background: rgba(10, 10, 10, 0.95);
    }

    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0.8rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .logo i {
      font-size: 1.8rem;
      color: var(--accent);
    }

    .logo h1 {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 350;
      color: var(--text-primary);
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--accent);
      transition: transform 0.3s ease;
    }

    .theme-toggle:hover {
      transform: rotate(15deg);
    }

    .menu-toggle {
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: color 0.2s;
      padding: 0.3rem;
      display: flex;
      align-items: center;
    }

    .menu-toggle:hover {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 300px;
      height: 100vh;
      background: var(--bg-primary);
      gap: 0;
      overflow-y: auto;
      transition: right 0.3s ease-out;
      box-shadow: -5px 0 30px rgba(0, 0, 0, 0.1);
      border-left: 1px solid var(--border);
      z-index: 1001;
      border-radius: 0;
      padding: 0;
    }

    .nav-links.active {
      right: 0;
    }

    .close-menu-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--accent);
      padding: 1rem;
      text-align: right;
      display: block;
      width: 100%;
      border-bottom: 1px solid var(--border);
    }

    .nav-links a {
      padding: 1rem 1.5rem;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.2s;
      border-bottom: 1px solid var(--border);
      display: block;
      font-size: 1rem;
      cursor: pointer;
    }

    .nav-links a:last-child {
      border-bottom: none;
    }

    .nav-links a:hover {
      background: var(--hover-bg);
      color: var(--accent);
      padding-left: 2rem;
    }

    .admin-nav-link {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.04) 100%) !important;
      color: var(--accent) !important;
      font-weight: 600;
      border-bottom: 2px solid var(--accent) !important;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .admin-nav-link[style*="display: block"] {
      display: flex !important;
    }

    .admin-nav-link:hover {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.08) 100%) !important;
      color: var(--accent-dark) !important;
      padding-left: 2.5rem !important;
      transform: translateX(2px);
    }

    .admin-nav-link i {
      font-size: 0.95rem;
    }

    .lang-menu {
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .lang-current {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: none;
      border: none;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      color: var(--text-primary);
      cursor: pointer;
    }

    .lang-current:hover {
      background: var(--hover-bg);
      color: var(--accent);
    }

    .lang-current i {
      transition: transform 0.3s ease;
    }

    .lang-menu.active .lang-current i {
      transform: rotate(180deg);
    }

    .lang-options {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background: var(--bg-primary);
    }

    .lang-menu.active .lang-options {
      max-height: 150px;
    }

    .lang-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.8rem 1.5rem 0.8rem 2.5rem;
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .lang-option:hover {
      background: var(--hover-bg);
      color: var(--accent);
    }

    @media (max-width: 768px) {
      body {
        padding-top: 65px;
      }

      .header-flex {
        padding: 0.6rem 1rem;
      }

      .logo h1 {
        font-size: 1.2rem;
      }

      .logo i {
        font-size: 1.5rem;
      }

      .right-group {
        gap: 8px;
      }

      .nav-links {
        width: 85%;
        right: -85%;
      }

    .admin-wrapper {

      width: 100%;
      background: var(--bg-primary);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 42px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
      overflow: hidden;
      padding: 2.2rem 2.5rem;
      transition: all 0.3s ease;
      animation: slideUp 0.6s ease-out;
      position: relative;
      z-index: 10;
      margin: 1rem auto;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {

      letter-spacing: 0.02em;

      align-items: center;

    h2 {

      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;

    .list-panel {
      background: var(--card-gradient);
      padding: 1.5rem;
      border-radius: 28px;
      border: 1px solid var(--border);
      max-height: 650px;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }

    .list-panel::-webkit-scrollbar {
      width: 6px;
    }

    .list-panel::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 3px;
    }

    .list-panel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    .admin-product-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s;
    }

    .admin-product-item:hover {
      background: var(--hover-bg);
      border-radius: 16px;
      transform: translateX(5px);
    }

    .admin-product-img {
      width: 50px;
      height: 50px;
      background: var(--bg-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .admin-product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .admin-product-img i {
      font-size: 1.6rem;
      color: var(--accent);
    }

    .admin-product-info {
      flex: 1;
    }

    .admin-product-title {
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .admin-product-brand {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .admin-product-price {
      font-weight: 500;
      color: var(--accent-dark);
      font-size: 0.9rem;
    }

    .admin-product-price::before {
      content: 'TND ';
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .product-category-badge {
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      display: inline-block;
      background: var(--bg-secondary);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }

    .product-season-badge {
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      display: inline-block;
      margin-left: 0.5rem;
    }

    .product-description-preview {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .image-count-badge {
      font-size: 0.65rem;
      color: var(--accent);
      margin-top: 0.2rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      padding: 8px;
      border-radius: 50%;
    }

    .delete-btn:hover {
      color: #c1654c;
      background: var(--hover-bg);
      transform: scale(1.1);
    }

    .empty-list {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .back-link {
      margin-top: 1.5rem;
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent);
      transition: all 0.2s;
    }

    .back-link:hover {
      color: var(--accent-dark);
      transform: translateX(-3px);
    }

    .loading-spinner {
      text-align: center;
      padding: 1.5rem;
      color: var(--accent);
    }

      // Theme Switcher
      function initTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
          document.body.classList.add('dark');
          const sun = document.querySelector('#themeToggle .fa-sun');
          const moon = document.querySelector('#themeToggle .fa-moon');
          if (sun) sun.style.display = 'none';
          if (moon) moon.style.display = 'inline-block';
        }
      }

      function toggleTheme() {
        if (document.body.classList.contains('dark')) {
          document.body.classList.remove('dark');
          localStorage.setItem('theme', 'light');
          const sun = document.querySelector('#themeToggle .fa-sun');
          const moon = document.querySelector('#themeToggle .fa-moon');
          if (sun) sun.style.display = 'inline-block';
          if (moon) moon.style.display = 'none';
        } else {
          document.body.classList.add('dark');
          localStorage.setItem('theme', 'dark');
          const sun = document.querySelector('#themeToggle .fa-sun');
          const moon = document.querySelector('#themeToggle .fa-moon');
          if (sun) sun.style.display = 'none';
          if (moon) moon.style.display = 'inline-block';
        }
      }

      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
      initTheme();

      // Menu Toggle
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');
      const closeMenuBtn = document.getElementById('closeMenuBtn');
      const langMenu = document.getElementById('langMenu');

      function closeMenu() {
        navLinks.classList.remove('active');
        document.body.style.overflow = '';
      }

      function openMenu() {
        navLinks.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      if (menuToggle) menuToggle.addEventListener('click', () => {
        navLinks.classList.contains('active') ? closeMenu() : openMenu();
      });

      if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', closeMenu);
      });

      if (langMenu) {
        const langCurrent = langMenu.querySelector('.lang-current');
        if (langCurrent) {
          langCurrent.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.classList.toggle('active');
          });
        }
        document.querySelectorAll('.lang-option').forEach(opt => {
          opt.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.classList.remove('active');
          });
        });
        langMenu.addEventListener('click', (e) => e.stopPropagation());
      }

      document.addEventListener('click', (e) => {
        if (navLinks && !navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
          closeMenu();
        }
      });

      // Load Products
      async function loadAdminProducts() {
        try {
          adminListContainer.innerHTML = '';
          loadingAdmin.style.display = 'block';

          const { data, error } = await supabase
            .from('products')
            .select('*')
            .order('created_at', { ascending: true });

          if (error) throw error;

          loadingAdmin.style.display = 'none';

          if (!data || data.length === 0) {
            adminListContainer.innerHTML = '<div class="empty-list">✨ Aucun parfum. <a href="adminadd.html">Ajouter le premier</a>.</div>';
            return;
          }

          const seasonNames = { all: 'Toutes saisons', summer: 'Été', winter: 'Hiver', spring: 'Printemps', autumn: 'Automne' };
          const categoryNames = { man: 'Homme', women: 'Femme', unisexe: 'Unisexe', kids: 'Enfants' };
          const categoryIcons = { man: '👔', women: '🌸', unisexe: '🕊️', kids: '🧸' };

          let html = '';
          data.forEach(prod => {
            const priceStr = parseFloat(prod.price).toFixed(3).replace('.', ',');

            // Get first image or default icon
            let imagesArray = [];
            try {
              imagesArray = typeof prod.images === 'string' ? JSON.parse(prod.images) : (prod.images || []);
            } catch (e) { imagesArray = []; }

            const firstImage = imagesArray.length > 0 ? imagesArray[0] : null;
            const iconOrImage = firstImage ? `<img src="${firstImage}" alt="${prod.name}">` : `<i class="fas fa-crown"></i>`;
            const imageCount = imagesArray.length;

            const seasonName = seasonNames[prod.season] || prod.season || 'Toutes saisons';
            let seasonIcon = '';
            if (prod.season === 'summer') seasonIcon = '<i class="fas fa-sun"></i> ';
            else if (prod.season === 'winter') seasonIcon = '<i class="fas fa-snowflake"></i> ';
            else if (prod.season === 'spring') seasonIcon = '<i class="fas fa-seedling"></i> ';
            else if (prod.season === 'autumn') seasonIcon = '<i class="fas fa-leaf"></i> ';
            else seasonIcon = '<i class="fas fa-globe"></i> ';

            const categoryName = categoryNames[prod.category] || prod.category || 'Non catégorisé';
            const categoryIcon = categoryIcons[prod.category] || '📦';

            const descriptionPreview = prod.description ? prod.description.substring(0, 50) + (prod.description.length > 50 ? '...' : '') : '';

            html += `
              <div class="admin-product-item" data-id="${prod.id}">
                <div class="admin-product-img">${iconOrImage}</div>
                <div class="admin-product-info">
                  <div class="admin-product-title">${prod.name}</div>
                  <div class="admin-product-brand">${prod.brand}</div>
                  <div class="admin-product-price">${priceStr} TND</div>
                  <div>
                    <span class="product-category-badge">${categoryIcon} ${categoryName}</span>
                    <span class="product-season-badge">${seasonIcon}${seasonName}</span>
                    ${imageCount > 0 ? `<span class="product-season-badge"><i class="fas fa-images"></i> ${imageCount}</span>` : ''}
                  </div>
                  ${descriptionPreview ? `<div class="product-description-preview">📝 ${descriptionPreview}</div>` : ''}
                </div>
                <button class="delete-btn" data-id="${prod.id}" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
              </div>
            `;
          });
          adminListContainer.innerHTML = html;
        } catch (error) {
          console.error('Erreur chargement:', error);
          loadingAdmin.style.display = 'none';
          adminListContainer.innerHTML = '<div class="empty-list">❌ Erreur de chargement</div>';
          showAdminToast('❌ Erreur chargement produits');
        }
      }

      // Delete Product
      async function deleteProduct(id) {
        if (!confirm('Supprimer ce produit ?')) return;

        try {
          const { error } = await supabase
            .from('products')
            .delete()
            .match({ id });

          if (error) throw error;

          showAdminToast('🗑️ Produit supprimé');
          loadAdminProducts();
        } catch (error) {
          console.error('Erreur suppression:', error);
          showAdminToast('❌ Erreur lors de la suppression');
        }
      }

      function showAdminToast(msg) {
        const toast = document.getElementById('adminToast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      // Event Listeners
      const adminListContainer = document.getElementById('adminProductListContainer');
      const loadingAdmin = document.getElementById('loadingAdmin');

      adminListContainer.addEventListener('click', (e) => {
        const deleteBtn = e.target.closest('.delete-btn');
        if (deleteBtn) {
          const id = deleteBtn.dataset.id;
          deleteProduct(id);
        }
      });

      // Load products on page load
      loadAdminProducts();

      // ========== TRANSLATION - APPLIED IMMEDIATELY ==========
      let currentLanguage = localStorage.getItem('language') || 'fr';
      let originalTexts = new Map();

      function storeOriginalTexts() {
        const elementsToStore = [
          document.querySelector('h1'),
          document.querySelector('h2'),
          document.querySelector('.back-link'),
          ...document.querySelectorAll('.empty-list'),
          ...document.querySelectorAll('.loading-spinner')
        ];

        elementsToStore.forEach(el => {
          if (el && el.textContent && el.textContent.trim() && !originalTexts.has(el)) {
            originalTexts.set(el, el.textContent);
          }
        });
      }

      function resetToFrench() {
        originalTexts.forEach((originalText, element) => {
          if (element && element.isConnected) {
            element.textContent = originalText;
          }
        });
        document.body.style.direction = 'ltr';
        currentLanguage = 'fr';
        localStorage.setItem('language', 'fr');
      }

      async function translatePage(targetLang) {
        if (targetLang === 'fr') {
          resetToFrench();
          return;
        }
        if (targetLang === currentLanguage && currentLanguage !== 'fr') return;

        const toast = document.getElementById('adminToast');
        if (toast) {
          toast.textContent = '🌍 Traduction en cours...';
          toast.classList.add('show');
        }

        if (originalTexts.size === 0) storeOriginalTexts();

        const elementsToTranslate = [];
        const textsToTranslate = [];

        originalTexts.forEach((originalText, element) => {
          if (element && element.isConnected && originalText && originalText.trim()) {
            textsToTranslate.push(originalText);
            elementsToTranslate.push(element);
          }
        });

        if (textsToTranslate.length === 0) {
          if (toast) toast.classList.remove('show');
          return;
        }

        try {
          const response = await fetch('https://dtwciuhwwanwlwpydeko.supabase.co/functions/v1/translate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_'
            },
            body: JSON.stringify({
              texts: textsToTranslate,
              targetLang: targetLang,
              sourceLang: 'FR'
            })
          });

          const data = await response.json();

          if (data.success && data.translations) {
            elementsToTranslate.forEach((element, index) => {
              const translated = data.translations[index];
              if (translated && translated !== element.textContent) {
                element.textContent = translated;
              }
            });
          }

          if (targetLang === 'ar') {
            document.body.style.direction = 'rtl';
          } else {
            document.body.style.direction = 'ltr';
          }

          currentLanguage = targetLang;
          localStorage.setItem('language', targetLang);

          if (toast) {
            toast.textContent = '✅ Traduction terminée!';
            setTimeout(() => toast.classList.remove('show'), 1500);
          }
        } catch (error) {
          console.error('Translation error:', error);
          if (toast) {
            toast.textContent = '❌ Erreur de traduction';
            setTimeout(() => toast.classList.remove('show'), 2000);
          }
        }
      }

      function setupLanguageSwitcher() {
        const langOptions = document.querySelectorAll('.lang-option');
        const currentLangSpan = document.getElementById('currentLangText');
        const langNames = { fr: 'FRANÇAIS', en: 'ENGLISH', ar: 'العربية' };

        langOptions.forEach(option => {
          option.addEventListener('click', async () => {
            const lang = option.getAttribute('data-lang');
            if (currentLangSpan) currentLangSpan.textContent = langNames[lang];
            document.getElementById('langMenu')?.classList.remove('active');
            await translatePage(lang);
          });
        });
      }

      function initLanguage() {
        storeOriginalTexts();
        const savedLang = localStorage.getItem('language') || 'fr';
        const langNames = { fr: 'FRANÇAIS', en: 'ENGLISH', ar: 'العربية' };
        const currentLangSpan = document.getElementById('currentLangText');
        if (currentLangSpan) currentLangSpan.textContent = langNames[savedLang];

        if (savedLang !== 'fr') {
          setTimeout(() => translatePage(savedLang), 10);
        }
      }

      initLanguage();

      // Update user nav links
      let updateUserTimeout;
      let isUpdatingUser = false;
      
      async function updateUserDisplay() {
        // Prevent concurrent calls
        if (isUpdatingUser) return;
        isUpdatingUser = true;
        
        try {
          const { data: { user } } = await supabase.auth.getUser();
          const authLink = document.getElementById('authLink');
          const profileLink = document.getElementById('profileLink');
          const adminLink = document.getElementById('adminLink');
          
          console.log('Checking user auth state...', user); // Debug log
          
          if (user) {
            console.log('✅ User logged in:', user.email); // Debug log
            if (authLink) {
              authLink.style.display = 'none';
              console.log('Hidden authLink');
            }
            if (profileLink) {
              profileLink.style.display = 'block';
              console.log('Shown profileLink');
            }
            // Check if user is the admin account
            if (user.email === 'azmmeli146@gmail.com') {
              if (adminLink) {
                adminLink.style.display = 'block';
                console.log('Shown adminLink');
              }
            } else {
              if (adminLink) {
                adminLink.style.display = 'none';
              }
            }
          } else {
            console.log('❌ User not logged in'); // Debug log
            if (authLink) {
              authLink.style.display = 'block';
              console.log('Shown authLink');
            }
            if (profileLink) {
              profileLink.style.display = 'none';
              console.log('Hidden profileLink');
            }
            if (adminLink) {
              adminLink.style.display = 'none';
            }
          }
        } catch (error) {
          console.error('Error checking user:', error);
        } finally {
          isUpdatingUser = false;
        }
      }
      
      // Call immediately
      updateUserDisplay();
      
      // Also set up listener for auth state changes with debounce
      // Only respond to meaningful events, skip TOKEN_REFRESHED which happens automatically
      supabase.auth.onAuthStateChange((event, session) => {
        console.log('Auth state changed:', event, session);
        // Only update on meaningful auth events, not token refreshes
        if (['SIGNED_IN', 'SIGNED_OUT', 'INITIAL_SESSION'].includes(event)) {
          // Clear any pending update
          if (updateUserTimeout) clearTimeout(updateUserTimeout);
          // Debounce the update by 100ms to avoid concurrent calls
          updateUserTimeout = setTimeout(() => updateUserDisplay(), 100);
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        setupLanguageSwitcher();
      });
    })();
  </script>
</body>
