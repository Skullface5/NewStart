<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sillage | Mon Profil</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #faf7f2;
            color: #2e2a28;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #ffffffd9;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #edeae4;
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1300px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            font-size: 2rem;
            color: #b6987a;
        }

        .logo h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 350;
        }

        .back-link {
            color: #b6987a;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-link i {
            margin-right: 5px;
            transition: transform 0.3s;
        }

        .back-link:hover {
            color: #8b6f5a;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }

        /* Main container */
        .profile-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile header */
        .profile-header {
            background: white;
            border-radius: 32px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.05);
            border: 1px solid #edeae4;
            display: flex;
            align-items: center;
            gap: 2rem;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: #f3ede7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar i {
            font-size: 3rem;
            color: #b6987a;
        }

        .profile-info h2 {
            font-size: 1.8rem;
            font-weight: 350;
            color: #3f3730;
            margin-bottom: 0.3rem;
        }

        .profile-info p {
            color: #9c8e82;
            font-size: 0.95rem;
        }

        .profile-info p i {
            margin-right: 8px;
            color: #b6987a;
        }

        .logout-btn {
            margin-left: auto;
            background: none;
            border: 1px solid #dbcec2;
            color: #2e2a28;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .logout-btn:hover {
            background: #b6987a;
            border-color: #b6987a;
            color: white;
        }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.03);
            border: 1px solid #edeae4;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .stat-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -10px rgba(182, 152, 122, 0.15);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: #f3ede7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon i {
            font-size: 1.5rem;
            color: #b6987a;
        }

        .stat-content h3 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #3f3730;
            line-height: 1.2;
        }

        .stat-content p {
            color: #9c8e82;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Orders section */
        .orders-section {
            background: white;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.05);
            border: 1px solid #edeae4;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .section-title i {
            font-size: 1.8rem;
            color: #b6987a;
        }

        .section-title h2 {
            font-size: 1.5rem;
            font-weight: 350;
            color: #3f3730;
        }

        /* Order filters */
        .order-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: none;
            border: 1px solid #dbcec2;
            color: #9c8e82;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn:hover {
            border-color: #b6987a;
            color: #b6987a;
        }

        .filter-btn.active {
            background: #b6987a;
            border-color: #b6987a;
            color: white;
        }

        /* Orders list */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-card {
            border: 1px solid #edeae4;
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s;
            animation: slideInOrder 0.5s ease-out;
            animation-fill-mode: both;
        }

        @keyframes slideInOrder {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .order-card:hover {
            border-color: #b6987a;
            box-shadow: 0 10px 25px -12px rgba(182, 152, 122, 0.2);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .order-id {
            font-weight: 500;
            color: #3f3730;
        }

        .order-id i {
            color: #b6987a;
            margin-right: 8px;
        }

        .order-date {
            color: #9c8e82;
            font-size: 0.9rem;
        }

        .order-date i {
            margin-right: 5px;
            color: #b6987a;
        }

        .order-status {
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-pending {
            background: #fff3e0;
            color: #b85c00;
        }

        .status-review {
            background: #e6f0ff;
            color: #2c5c8c;
        }

        .status-shipped {
            background: #e2f0e6;
            color: #2c682c;
        }

        .status-delivered {
            background: #e2f0e6;
            color: #2c682c;
        }

        .status-cancelled {
            background: #ffe6e6;
            color: #b34545;
        }

        .order-items {
            margin: 1rem 0;
            padding: 1rem 0;
            border-top: 1px dashed #edeae4;
            border-bottom: 1px dashed #edeae4;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .order-item-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-item-name i {
            color: #b6987a;
            width: 20px;
        }

        .order-item-quantity {
            color: #9c8e82;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .order-item-price {
            font-weight: 500;
            color: #3f3730;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-weight: 500;
        }

        .order-total span:first-child {
            color: #9c8e82;
        }

        .order-total span:last-child {
            font-size: 1.2rem;
            color: #3f3730;
        }

        .order-total span:last-child::before {
            content: 'TND';
            margin-right: 2px;
            color: #b6987a;
        }

        /* Empty state */
        .empty-orders {
            text-align: center;
            padding: 4rem 2rem;
            color: #9c8e82;
        }

        .empty-orders i {
            font-size: 4rem;
            color: #dbcec2;
            margin-bottom: 1rem;
        }

        .empty-orders p {
            margin-bottom: 1.5rem;
        }

        .shop-now-btn {
            display: inline-block;
            background: #b6987a;
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 40px;
            transition: all 0.3s;
        }

        .shop-now-btn:hover {
            background: #a07d63;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px #b6987a;
        }

        /* Loading */
        .loading-spinner {
            text-align: center;
            padding: 3rem;
            color: #b6987a;
        }

        /* Not logged in */
        .not-logged-in {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 32px;
        }

        .not-logged-in i {
            font-size: 4rem;
            color: #b6987a;
            margin-bottom: 1rem;
        }

        .not-logged-in h2 {
            font-size: 1.8rem;
            font-weight: 350;
            margin-bottom: 1rem;
        }

        .not-logged-in p {
            color: #9c8e82;
            margin-bottom: 2rem;
        }

        .login-btn {
            display: inline-block;
            background: #b6987a;
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 40px;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: #a07d63;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #9c8e82;
            font-size: 0.8rem;
            border-top: 1px solid #e7dfd7;
            margin-top: 3rem;
        }


        .cancel-btn {
            background: none;
            border: 1px solid #b34545;
            color: #b34545;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .cancel-btn:hover {
            background: #b34545;
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-flex">
            <div class="logo">
                <i class="fas fa-spa"></i>
                <h1>SILLAGE</h1>
            </div>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Retour à la boutique
            </a>
        </div>
    </header>

    <main class="profile-container" id="profileContainer" style="display: none;">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="profile-info">
                <h2 id="userName">Chargement...</h2>
                <p><i class="fas fa-envelope"></i> <span id="userEmail"></span></p>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalOrders">0</h3>
                    <p>Commandes totales</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-content">
                    <h3 id="pendingOrders">0</h3>
                    <p>En cours</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-content">
                    <h3 id="deliveredOrders">0</h3>
                    <p>Livrées</p>
                </div>
            </div>
        </div>

        <!-- Orders Section -->
        <div class="orders-section">
            <div class="section-title">
                <i class="fas fa-history"></i>
                <h2>Historique des commandes</h2>
            </div>

            <!-- Order Filters -->
            <div class="order-filters">
                <button class="filter-btn active" onclick="filterOrders('all')">Toutes</button>
                <button class="filter-btn" onclick="filterOrders('pending')">En attente</button>
                <button class="filter-btn" onclick="filterOrders('review')">En révision</button>
                <button class="filter-btn" onclick="filterOrders('shipped')">Expédiées</button>
                <button class="filter-btn" onclick="filterOrders('delivered')">Livrées</button>
            </div>

            <!-- Orders List -->
            <div id="ordersList" class="orders-list">
                <!-- Orders will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Not logged in message -->
    <div id="notLoggedIn" class="profile-container" style="display: none;">
        <div class="not-logged-in">
            <i class="fas fa-user-lock"></i>
            <h2>Non connecté</h2>
            <p>Veuillez vous connecter pour voir votre profil et vos commandes.</p>
            <a href="login146.html" class="login-btn">Se connecter</a>
        </div>
    </div>

    <footer>
        <p>© Sillage Atelier – impressions éthérées depuis 2025</p>
    </footer>

    <script>
        // ---------- SUPABASE CONFIG ----------
        const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DOM elements
        const profileContainer = document.getElementById('profileContainer');
        const notLoggedIn = document.getElementById('notLoggedIn');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        const totalOrdersEl = document.getElementById('totalOrders');
        const pendingOrdersEl = document.getElementById('pendingOrders');
        const deliveredOrdersEl = document.getElementById('deliveredOrders');
        const ordersList = document.getElementById('ordersList');
        const logoutBtn = document.getElementById('logoutBtn');

        let currentUser = null;
        let allOrders = [];



        // Check if user is logged in
        async function checkUser() {
            try {
                const { data: { user }, error } = await supabaseClient.auth.getUser();

                if (error || !user) {
                    // Not logged in
                    profileContainer.style.display = 'none';
                    notLoggedIn.style.display = 'block';
                    return;
                }

                // User is logged in
                currentUser = user;
                profileContainer.style.display = 'block';
                notLoggedIn.style.display = 'none';

                // Update profile info
                userName.textContent = user.email?.split('@')[0] || 'Client';
                userEmail.textContent = user.email;

                // Load orders (using sample data for now)
                loadOrders();

            } catch (err) {
                console.error('Error checking user:', err);
                profileContainer.style.display = 'none';
                notLoggedIn.style.display = 'block';
            }
        }

        // Load orders from database
        async function loadOrders() {
            try {
                // Show loading state
                ordersList.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Chargement de vos commandes...</div>';

                // Fetch real orders from Supabase for this user
                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Store orders
                allOrders = orders || [];

                console.log('Orders loaded:', allOrders); // Check console

                // Update stats
                updateStats();

                // Display orders
                displayOrders('all');

            } catch (error) {
                console.error('Error loading orders:', error);
                ordersList.innerHTML = '<div class="empty-orders">Erreur lors du chargement des commandes</div>';
            }
        }

        // Update statistics
        // Update statistics
        function updateStats() {
            totalOrdersEl.textContent = allOrders.length;

            const pending = allOrders.filter(o =>
                o.status === 'pending' || o.status === 'review' || o.status === 'shipped'
            ).length;

            const delivered = allOrders.filter(o =>
                o.status === 'delivered'
            ).length;

            pendingOrdersEl.textContent = pending;
            deliveredOrdersEl.textContent = delivered;
        }

        // Display orders with filter
        function displayOrders(filter) {
            let filteredOrders = allOrders;

            if (filter !== 'all') {
                filteredOrders = allOrders.filter(o => o.status === filter);
            }

            if (filteredOrders.length === 0) {
                ordersList.innerHTML = `
          <div class="empty-orders"> 
            <i class="fas fa-box-open"></i>
            <p>Aucune commande trouvée</p>   
            <a href="index.html" class="shop-now-btn">Découvrir nos parfums</a>
          </div>
        `;
                return;
            }

            let ordersHtml = '';
            filteredOrders.forEach((order, index) => {
                const statusText = getStatusText(order.status);
                const statusClass = getStatusClass(order.status);

                // Format date
                const orderDate = new Date(order.created_at);
                const formattedDate = orderDate.toLocaleDateString('fr-FR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Generate items HTML
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
            <div class="order-item">
              <div class="order-item-name">
                <i class="fas fa-leaf"></i>
                <span>${item.name}</span>
                <span class="order-item-quantity">x${item.quantity}</span>
              </div>
              <span class="order-item-price">${item.price.toFixed(2).replace('.', ',')} TND</span>
            </div>
          `;
                });

                ordersHtml += `
  <div class="order-card" style="animation-delay: ${index * 0.1}s">
    <div class="order-header">
      <div class="order-id">
        <i class="fas fa-receipt"></i> ${order.id}
      </div>
      <div class="order-date">
        <i class="fas fa-calendar-alt"></i> ${formattedDate}
      </div>
      <div class="order-status ${statusClass}">
        <i class="fas ${getStatusIcon(order.status)}"></i>
        ${statusText}
      </div>s
    </div>
    <div class="order-items">
      ${itemsHtml}
    </div>
    <div class="order-total">
      <span>Total</span>
      <span>${order.total.toFixed(3).replace('.', ',')} TND</span>
    </div>
    ${order.status === 'pending' ? `
      <div style="margin-top: 15px; text-align: right;">
        <button onclick="cancelOrder('${order.id}')" style="background: none; border: 1px solid #b34545; color: #b34545; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-size: 0.9rem;">
    <i class="fas fa-times"></i> Annuler la commande
</button>
      </div>
    ` : ''}
  </div>
`;
            });

            ordersList.innerHTML = ordersHtml;
        }

        // Cancel order function
        window.cancelOrder = async function (orderId) {
            console.log('Cancel button clicked for order:', orderId);

            if (!confirm('Êtes-vous sûr de vouloir annuler cette commande ?')) {
                return;
            }

            try {
                console.log('Current user:', currentUser);
                console.log('Order ID to cancel:', orderId);

                // First, check if the order exists and belongs to this user
                const { data: checkOrder, error: checkError } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('id', orderId)
                    .eq('user_id', currentUser.id);

                if (checkError) throw checkError;

                console.log('Found order:', checkOrder);

                if (!checkOrder || checkOrder.length === 0) {
                    alert('❌ Commande non trouvée ou ne vous appartient pas');
                    return;
                }

                // Show loading state on button
                const buttons = document.querySelectorAll(`[onclick*="cancelOrder('${orderId}')"]`);
                const button = buttons[0];
                if (button) {
                    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Annulation...';
                    button.disabled = true;
                }

                // Update order status
                const { data, error } = await supabaseClient
                    .from('orders')
                    .update({ status: 'cancelled' })
                    .eq('id', orderId)
                    .eq('user_id', currentUser.id)
                    .select();

                if (error) throw error;

                console.log('Update result:', data);

                if (data && data.length > 0) {
                    alert('✅ Commande annulée avec succès');
                    await loadOrders();
                } else {
                    alert('❌ Aucune modification: la commande a peut-être déjà été annulée');
                }

            } catch (error) {
                console.error('Error:', error);
                alert('❌ Erreur: ' + error.message);
            }
        };

        // Helper functions for order status
        function getStatusText(status) {
            const statusMap = {
                'pending': 'En attente',
                'review': 'En révision',
                'shipped': 'Expédiée',
                'delivered': 'Livrée',
                'cancelled': 'Annulée'
            };
            return statusMap[status] || status;
        }

        function getStatusClass(status) {
            const classMap = {
                'pending': 'status-pending',
                'review': 'status-review',
                'shipped': 'status-shipped',
                'delivered': 'status-delivered',
                'cancelled': 'status-cancelled'
            };
            return classMap[status] || '';
        }

        function getStatusIcon(status) {
            const iconMap = {
                'pending': 'fa-clock',
                'review': 'fa-search',
                'shipped': 'fa-truck',
                'delivered': 'fa-check-circle',
                'cancelled': 'fa-times-circle'
            };
            return iconMap[status] || 'fa-circle';
        }

        // Filter orders
        window.filterOrders = function (filter) {
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            displayOrders(filter);
        };

        // Logout
        logoutBtn.addEventListener('click', async () => {
            if (confirm('Se déconnecter ?')) {
                await supabaseClient.auth.signOut();
                window.location.reload();
            }
        });

        // Initialize
        checkUser();

        // Listen for auth changes
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                window.location.reload();
            }
        });
    </script>
</body>

</html>
