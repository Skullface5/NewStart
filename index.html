<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sillage | Atelier de Parfums</title>
  <!-- Font Awesome 6 (gratuit) pour icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* === RESET & VARIABLES === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #faf7f2;  /* fond crème doux */
      color: #2e2a28;
      line-height: 1.5;
    }

    /* texture de bruit subtile (optionnel) */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc0IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wMjUiIC8+PC9zdmc+');
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* === TYPOGRAPHIE & GLOBAL === */
    h1, h2, h3 {
      font-weight: 350;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* === EN-TÊTE / NAVIGATION === */
    header {
      background: #ffffffd9;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.02);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #edeae4;
    }

    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo i {
      font-size: 2rem;
      color: #b6987a;  /* terracotta doux */
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      font-weight: 400;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
    }

    .nav-links a {
      text-decoration: none;
      color: #2e2a28;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #b6987a;
    }

    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.6rem;
      color: #2e2a28;
      transition: color 0.2s;
    }

    .cart-icon:hover {
      color: #b6987a;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #b6987a;
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(182,152,122,0.3);
    }

    /* === SECTION HÉRO (simple) === */
    .hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
      background: linear-gradient(145deg, #f3eee8 0%, #faf7f2 70%);
      margin-bottom: 1rem;
    }

    .hero h2 {
      font-size: 2.5rem;
      font-weight: 300;
      color: #3f3a35;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1rem;
      color: #7a6e64;
      max-width: 550px;
      margin: 0 auto;
    }

    /* === GRILLE PRODUITS === */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem 1.5rem;
      margin: 3rem 0;
    }

    .product-card {
      background: white;
      border-radius: 28px;
      padding: 1.8rem 1.2rem 1.5rem;
      box-shadow: 0 12px 30px -8px rgba(0,0,0,0.05);
      transition: transform 0.25s ease, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid #f1ede8;
      backdrop-filter: blur(2px);
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 22px 40px -12px rgba(98, 78, 62, 0.15);
      border-color: #e1d5cc;
    }

    .product-img {
      width: 150px;
      height: 150px;
      background: #f3ede7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 -4px 8px rgba(255,255,255,0.6), 0 12px 18px -14px rgba(0,0,0,0.2);
    }

    .product-img i {
      font-size: 5rem;
      color: #917b67;
      filter: drop-shadow(2px 6px 10px rgba(106, 79, 57, 0.15));
    }

    .product-title {
      font-size: 1.35rem;
      font-weight: 400;
      margin-bottom: 0.35rem;
      color: #342e29;
    }

    .product-brand {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #b6987a;
      margin-bottom: 0.75rem;
    }

    .product-price {
      font-size: 1.5rem;
      font-weight: 350;
      color: #3f3730;
      margin: 0.5rem 0 1rem;
    }

    .product-price::before {
      content: '€';
      font-size: 1rem;
      margin-right: 2px;
      color: #887b70;
    }

    .add-to-cart {
      background: transparent;
      border: 1.5px solid #d6c9bf;
      color: #2e2a28;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: auto;
      width: fit-content;
    }

    .add-to-cart:hover {
      background: #b6987a;
      border-color: #b6987a;
      color: white;
      box-shadow: 0 8px 16px -8px #b6987aaa;
    }

    /* === PANIER LATÉRAL === */
    .cart-overlay {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(3px);
      z-index: 200;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .cart-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .cart-sidebar {
      position: fixed;
      top: 0; right: -400px;
      width: 380px;
      max-width: 90vw;
      height: 100vh;
      background: #ffffffec;
      backdrop-filter: blur(14px);
      box-shadow: -10px 0 30px -10px rgba(0,0,0,0.15);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease-out;
      z-index: 250;
      border-left: 1px solid #ece3db;
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e9dfd6;
      padding-bottom: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .cart-header h3 {
      font-size: 1.3rem;
      font-weight: 350;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #8f8278;
      transition: color 0.2s;
    }

    .close-cart:hover {
      color: #2e2a28;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px dashed #e2d7ce;
      padding-bottom: 1rem;
    }

    .cart-item-icon {
      background: #f0e8e0;
      width: 50px;
      height: 50px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cart-item-icon i {
      font-size: 1.8rem;
      color: #7e6b5b;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    .cart-item-price {
      color: #897c71;
      font-size: 0.9rem;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: #b5a398;
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0 5px;
    }

    .cart-item-remove:hover {
      color: #b15e4b;
    }

    .cart-footer {
      border-top: 1px solid #e9dfd6;
      padding-top: 1.5rem;
      margin-top: 1rem;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.25rem;
      font-weight: 350;
      margin-bottom: 1.2rem;
    }

    .checkout-btn {
      width: 100%;
      background: #b6987a;
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .checkout-btn:hover {
      background: #a07d63;
    }

    .checkout-btn:active {
      transform: scale(0.98);
    }

    .empty-cart-message {
      color: #9b9086;
      text-align: center;
      margin-top: 2rem;
      font-style: italic;
    }

    /* === NOTIFICATION (toast) === */
    .notification {
      position: fixed;
      bottom: 30px; left: 30px;
      background: #2e2a28;
      color: #f0e7de;
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      font-size: 0.9rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transform: translateY(100px);
      opacity: 0;
      transition: 0.2s;
      z-index: 300;
    }

    .notification.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* === PIED DE PAGE === */
    footer {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      color: #9c8e82;
      font-size: 0.8rem;
      border-top: 1px solid #e7dfd7;
      margin-top: 2rem;
    }

    /* === AJUSTEMENTS RESPONSIVE === */
    @media (max-width: 600px) {
      .header-flex {
        flex-wrap: wrap;
        gap: 0.8rem;
      }
      .nav-links {
        gap: 1.2rem;
        order: 3;
        width: 100%;
        justify-content: center;
      }
      .hero h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- NOTIFICATION TOAST -->
  <div id="toast" class="notification">✨ Article ajouté</div>

  <!-- OVERLAY & PANIER LATÉRAL -->
  <div id="cartOverlay" class="cart-overlay"></div>
  <aside id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h3><i class="fas fa-bag-shopping" style="margin-right: 8px;"></i> Votre panier</h3>
      <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItemsContainer" class="cart-items">
      <!-- les articles du panier apparaîtront ici -->
      <div class="empty-cart-message">Votre panier est vide.</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotalPrice">€0,00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">PAIEMENT <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
    </div>
  </aside>

  <!-- PAGE PRINCIPALE -->
  <header>
    <div class="container header-flex">
      <div class="logo">
        <i class="fas fa-spa"></i>
        <h1>SILLAGE</h1>
      </div>
      <div class="nav-links">
        <a href="admintypeshii.html">Log_in</a>
        <a href="#">COLLECTION</a>
        <a href="#">EXCLUSIVITÉS</a>
        <a href="#">COFFRETS</a>
        <a href="#">NOTRE HISTOIRE</a>
      </div>
      <div class="cart-icon" id="cartToggle">
        <i class="fas fa-bag-shopping"></i>
        <span id="cartCount" class="cart-count">0</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>poésie olfactive</h2>
      <p>Parfums de niche sélectionnés à la main – intemporels, sensuels, authentiques.</p>
    </section>

    <!-- GRILLE PRODUITS -->
    <div class="product-grid" id="productGrid">
      <!-- les produits seront injectés via JS -->
    </div>
  </main>

  <footer>
    <p>© Sillage Atelier – impressions éthérées depuis 2025</p>
  </footer>

  <script>
    (function() {
      // ---------- CATALOGUE (données parfums) ----------
      const products = [
        {
          id: 'p1',
          name: 'Bois d’Argent',
          brand: 'PHYSALIS',
          price: 89.00,
          icon: 'fa-solid fa-leaf'
        },
        {
          id: 'p2',
          name: 'Iris Cendré',
          brand: 'NAEVE',
          price: 120.00,
          icon: 'fa-solid fa-plant-wilt'
        },
        {
          id: 'p3',
          name: 'Cuir Balsamique',
          brand: 'ATELIER D’OMBRE',
          price: 150.00,
          icon: 'fa-solid fa-tree'
        },
        {
          id: 'p4',
          name: 'Vanille d’Orléans',
          brand: 'JARDIN RÊVÉ',
          price: 76.00,
          icon: 'fa-solid fa-flower'
        },
        {
          id: 'p5',
          name: 'Encens Suave',
          brand: 'FUMÉE',
          price: 204.00,
          icon: 'fa-solid fa-cloud-moon'
        },
        {
          id: 'p6',
          name: 'Eau de Néroli',
          brand: 'LA SERENA',
          price: 68.00,
          icon: 'fa-solid fa-sun-plant-wilt'
        }
      ];

      // ---------- ÉTAT GLOBAL ----------
      let cart = JSON.parse(localStorage.getItem('sillage_cart')) || [];   // tableau d'articles { id, name, price, icon, quantity: 1 }
      const cartSidebar = document.getElementById('cartSidebar');
      const cartOverlay = document.getElementById('cartOverlay');
      const cartToggle = document.getElementById('cartToggle');
      const closeCartBtn = document.getElementById('closeCartBtn');
      const cartCountSpan = document.getElementById('cartCount');
      const cartItemsContainer = document.getElementById('cartItemsContainer');
      const cartTotalSpan = document.getElementById('cartTotalPrice');
      const toast = document.getElementById('toast');
      const productGrid = document.getElementById('productGrid');
      const checkoutBtn = document.getElementById('checkoutBtn');

      // ---------- FONCTIONS UTILITAIRES ----------
      function formatPrice(price) {
        return '€' + price.toFixed(2).replace('.', ',');
      }

      // afficher la grille produits
      function renderProducts() {
        let html = '';
        products.forEach(p => {
          html += `
            <div class="product-card" data-product-id="${p.id}">
              <div class="product-img">
                <i class="fas ${p.icon}"></i>
              </div>
              <div class="product-title">${p.name}</div>
              <div class="product-brand">${p.brand}</div>
              <div class="product-price">${p.price.toFixed(2).replace('.', ',')}</div>
              <button class="add-to-cart" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}" data-icon="${p.icon}">Ajouter au panier</button>
            </div>
          `;
        });
        productGrid.innerHTML = html;
      }

      // mettre à jour le compteur du panier
      function updateCartCount() {
        const totalItems = cart.reduce((acc, item) => acc + (item.quantity || 1), 0);
        cartCountSpan.textContent = totalItems;
      }

      // afficher les articles dans le panier latéral
      function renderCart() {
        if (cart.length === 0) {
          cartItemsContainer.innerHTML = '<div class="empty-cart-message">Votre panier est vide.</div>';
          cartTotalSpan.textContent = '€0,00';
          return;
        }

        let itemsHtml = '';
        let total = 0;
        cart.forEach(item => {
          const subtotal = item.price * (item.quantity || 1);
          total += subtotal;
          itemsHtml += `
            <div class="cart-item" data-id="${item.id}">
              <div class="cart-item-icon"><i class="fas ${item.icon}"></i></div>
              <div class="cart-item-info">
                <div class="cart-item-title">${item.name}</div>
                <div class="cart-item-price">${formatPrice(item.price)} ${item.quantity > 1 ? ' (x' + item.quantity + ')' : ''}</div>
              </div>
              <button class="cart-item-remove" data-id="${item.id}" aria-label="Retirer"><i class="fas fa-trash-alt"></i></button>
            </div>
          `;
        });
        cartItemsContainer.innerHTML = itemsHtml;
        cartTotalSpan.textContent = formatPrice(total);
      }

      // sauvegarder le panier dans localStorage et mettre à jour l'UI
      function saveAndUpdate() {
        localStorage.setItem('sillage_cart', JSON.stringify(cart));
        updateCartCount();
        renderCart();
      }

      // ajouter un produit au panier
      function addToCart(id, name, price, icon) {
        const existing = cart.find(item => item.id === id);
        if (existing) {
          existing.quantity = (existing.quantity || 1) + 1;
        } else {
          cart.push({ id, name, price, icon, quantity: 1 });
        }
        saveAndUpdate();
        showToast('✨ ' + name + ' ajouté');
      }

      // retirer un produit du panier
      function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        saveAndUpdate();
        if (cart.length === 0) {
          // le panier reste ouvert
        }
        showToast('🗑️ Article retiré');
      }

      // message toast
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      // ouvrir/fermer le panier
      function openCart() {
        cartSidebar.classList.add('open');
        cartOverlay.classList.add('active');
      }

      function closeCart() {
        cartSidebar.classList.remove('open');
        cartOverlay.classList.remove('active');
      }

      // ---------- GESTIONNAIRES D'ÉVÉNEMENTS ----------
      // grille produit : ajout au panier
      productGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('.add-to-cart');
        if (!btn) return;
        const id = btn.dataset.id;
        const name = btn.dataset.name;
        const price = parseFloat(btn.dataset.price);
        const icon = btn.dataset.icon;
        addToCart(id, name, price, icon);
      });

      // suppression d'un article (délégation via le conteneur)
      cartItemsContainer.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.cart-item-remove');
        if (removeBtn) {
          const id = removeBtn.dataset.id;
          removeFromCart(id);
        }
      });

      // ouvrir le panier au clic sur l'icône
      cartToggle.addEventListener('click', (e) => {
        e.preventDefault();
        openCart();
      });

      closeCartBtn.addEventListener('click', closeCart);
      cartOverlay.addEventListener('click', closeCart);

      // bouton de paiement (simple alerte pour la démo)
      checkoutBtn.addEventListener('click', () => {
        if (cart.length === 0) {
          showToast('🛒 Votre panier est vide');
        } else {
          alert('Redirection vers la page de paiement (démonstration) – Merci pour votre achat !');
          // optionnel : vider le panier ?
          // cart = []; saveAndUpdate(); closeCart();
        }
      });

      // ---------- INITIALISATION ----------
      renderProducts();
      saveAndUpdate();  // met à jour compteur et panier depuis localStorage
    })();
  </script>
</body>
</html>
