<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Rosa Fragrances | Détail du produit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.5;
            position: relative;
            overflow-x: hidden;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #fffbf5;
            --bg-gradient: linear-gradient(135deg, #fff9f0 0%, #ffffff 100%);
            --text-primary: #2e2a28;
            --text-secondary: #6b5c4f;
            --accent: #d4af37;
            --accent-dark: #b4942c;
            --accent-gradient: linear-gradient(135deg, #d4af37 0%, #f5d742 50%, #d4af37 100%);
            --border: rgba(212, 175, 55, 0.2);
            --card-gradient: linear-gradient(145deg, #ffffff 0%, #fffaf2 100%);
            --shadow-sm: 0 5px 20px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 30px rgba(212, 175, 55, 0.08);
            --shadow-lg: 0 20px 40px rgba(212, 175, 55, 0.12);
            --input-bg: #ffffff;
            --hover-bg: rgba(212, 175, 55, 0.05);
        }

        body.dark {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-gradient: linear-gradient(135deg, #0a0a0a 0%, #141414 100%);
            --text-primary: #f5f5f5;
            --text-secondary: #b8b8b8;
            --accent: #ffd700;
            --accent-gradient: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            --border: rgba(255, 215, 0, 0.2);
            --card-gradient: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            --input-bg: #2a2a2a;
            --hover-bg: rgba(255, 215, 0, 0.1);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        body.dark header {
            background: rgba(10, 10, 10, 0.95);
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0.8rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo i {
            font-size: 1.8rem;
            color: var(--accent);
        }

        .logo h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 350;
            color: var(--text-primary);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.6rem;
            color: var(--accent);
            margin-right: 15px;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 0.7rem;
            font-weight: 600;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--accent);
            margin-right: 15px;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 300px;
            height: 100vh;
            background: var(--bg-primary);
            gap: 0;
            overflow-y: auto;
            transition: right 0.3s ease-out;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.1);
            border-left: 1px solid var(--border);
            z-index: 200;
            padding: 80px 0 2rem 0;
        }

        .nav-links.active {
            right: 0;
        }

        .nav-links a {
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
            border-bottom: 1px solid var(--border);
            display: block;
        }

        .nav-links a:hover {
            background: var(--hover-bg);
            color: var(--accent);
            padding-left: 2rem;
        }

        .lang-menu {
            border-bottom: 1px solid var(--border);
        }

        .lang-current {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: none;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .lang-options {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: var(--bg-primary);
        }

        .lang-menu.active .lang-options {
            max-height: 150px;
        }

        .lang-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.8rem 1.5rem 0.8rem 2.5rem;
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .menu-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        /* Product Detail Styles */
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: var(--card-gradient);
            border-radius: 32px;
            padding: 2rem;
            margin-bottom: 3rem;
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            .container {
                padding: 1rem;
            }

            .header-flex {
                padding: 0.6rem 1rem;
            }

            .logo h1 {
                font-size: 1.2rem;
            }
        }

        .product-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 50%;
            box-shadow: var(--shadow-lg);
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        .product-image i {
            font-size: 8rem;
            color: var(--accent);
        }

        .product-info h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .product-brand {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.8rem;
            color: var(--accent);
            margin: 1rem 0;
        }

        .product-description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 1rem 0;
        }

        .product-meta {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .meta-badge {
            background: var(--bg-secondary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .add-to-cart-btn {
            background: var(--accent-gradient);
            border: none;
            color: var(--bg-primary);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Suggestions Section */
        .suggestions-section {
            margin-top: 2rem;
        }

        .suggestions-section h2 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .suggestion-card {
            background: var(--card-gradient);
            border-radius: 24px;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
        }

        .suggestion-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }

        .suggestion-img {
            width: 100px;
            height: 100px;
            margin: 0 auto 0.8rem;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suggestion-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .suggestion-img i {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .suggestion-name {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .suggestion-brand {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
        }

        .suggestion-price {
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 0.3rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--accent);
        }

        .error-message {
            text-align: center;
            padding: 2rem;
            color: #c1654c;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 400px;
            height: 100vh;
            background: var(--bg-primary);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease-out;
            z-index: 250;
            border-left: 1px solid var(--border);
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.1);
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 1rem;
        }

        .cart-item-icon {
            width: 50px;
            height: 50px;
            background: var(--bg-secondary);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }

        .quantity-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: none;
            cursor: pointer;
        }

        .cart-item-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: var(--bg-primary);
            border: none;
            padding: 0.8rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .cart-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--accent-gradient);
            color: var(--bg-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.2s;
            z-index: 300;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .suggestions-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .suggestion-img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>
    <div id="menuOverlay" class="menu-overlay"></div>
    <div id="toast" class="notification">✨ Article ajouté</div>

    <!-- Cart Sidebar -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <aside id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3><i class="fas fa-bag-shopping"></i> Votre panier</h3>
            <button id="closeCartBtn"
                style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--accent);"><i
                    class="fas fa-times"></i></button>
        </div>
        <div id="cartItemsContainer" class="cart-items">
            <div class="empty-cart-message" style="text-align:center; padding:2rem;">Votre panier est vide.</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total</span><span id="cartTotalPrice">0,000 TND</span></div>
            <button class="checkout-btn" id="checkoutBtn">PAIEMENT <i class="fas fa-arrow-right"></i></button>
        </div>
    </aside>

    <header>
        <div class="header-flex">
            <a href="index.html" class="logo">
                <i class="fas fa-spa"></i>
                <h1>Rosa Fragrances</h1>
            </a>
            <div style="display: flex; align-items: center;">
                <div class="theme-toggle" id="themeToggle"><i class="fas fa-sun"></i><i class="fas fa-moon"
                        style="display: none;"></i></div>
                <div class="cart-icon" id="cartToggle"><i class="fas fa-bag-shopping"></i><span id="cartCount"
                        class="cart-count">0</span></div>
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">ACCUEIL</a>
                <a href="man.html">HOMME</a>
                <a href="women.html">FEMME</a>
                <a href="unisexe.html">UNISEXE</a>
                <a href="kids.html">ENFANTS</a>
                <div class="lang-menu" id="langMenu">
                    <button class="lang-current"><span id="currentLangText">FRANÇAIS</span><i
                            class="fas fa-chevron-down"></i></button>
                    <div class="lang-options">
                        <button class="lang-option" data-lang="fr">🇫🇷 Français</button>
                        <button class="lang-option" data-lang="en">🇬🇧 English</button>
                        <button class="lang-option" data-lang="ar">🇸🇦 العربية</button>
                    </div>
                </div>
                <a href="login146.html">Se connecter</a>
                <a href="profile.html" style="display: none;">Mon Profil</a>
            </div>
        </div>
    </header>

    <main class="container">
        <a href="javascript:history.back()" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>

        <div id="productDetailContainer">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
        </div>

        <div id="suggestionsContainer" class="suggestions-section" style="display: none;">
            <h2><i class="fas fa-star"></i> Vous aimerez aussi</h2>
            <div id="suggestionsGrid" class="suggestions-grid"></div>
        </div>
    </main>

    <footer style="text-align:center; padding:2rem; border-top:1px solid var(--border); margin-top:2rem;">
        <p>© Rosa Fragrances Atelier – impressions éthérées depuis 2026-2027</p>
    </footer>

    <script>
        (function () {
            const SUPABASE_URL = 'https://dtwciuhwwanwlwpydeko.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_ONI_1fHQUMD969B1TElxwA_m9rqzyk_';

            let currentProduct = null;
            let allProducts = [];
            let cart = JSON.parse(localStorage.getItem('RosaFragrances_cart')) || [];

            // Get product ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            // DOM elements
            const productDetailContainer = document.getElementById('productDetailContainer');
            const suggestionsContainer = document.getElementById('suggestionsContainer');
            const suggestionsGrid = document.getElementById('suggestionsGrid');
            const cartSidebar = document.getElementById('cartSidebar');
            const cartOverlay = document.getElementById('cartOverlay');
            const cartToggle = document.getElementById('cartToggle');
            const closeCartBtn = document.getElementById('closeCartBtn');
            const cartCountSpan = document.getElementById('cartCount');
            const cartItemsContainer = document.getElementById('cartItemsContainer');
            const cartTotalSpan = document.getElementById('cartTotalPrice');
            const toast = document.getElementById('toast');
            const checkoutBtn = document.getElementById('checkoutBtn');

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function formatPrice(p) {
                return parseFloat(p).toFixed(3).replace('.', ',') + ' TND';
            }

            function calculateTotal() {
                return cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            }

            function updateCartCount() {
                const total = cart.reduce((acc, i) => acc + (i.quantity || 1), 0);
                if (cartCountSpan) cartCountSpan.textContent = total;
            }

            function saveCart() {
                localStorage.setItem('RosaFragrances_cart', JSON.stringify(cart));
                updateCartCount();
                renderCart();
            }

            function renderCart() {
                if (!cartItemsContainer) return;
                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = '<div style="text-align:center; padding:2rem;">Votre panier est vide.</div>';
                    if (cartTotalSpan) cartTotalSpan.textContent = '0,000 TND';
                    return;
                }
                let html = '';
                let total = 0;
                cart.forEach(item => {
                    const sub = item.price * (item.quantity || 1);
                    total += sub;
                    html += `
                        <div class="cart-item" data-id="${item.id}">
                            <div class="cart-item-icon"><i class="fas ${item.icon || 'fa-leaf'}"></i></div>
                            <div class="cart-item-info">
                                <div class="cart-item-title">${escapeHtml(item.name)}</div>
                                <div class="cart-item-price">${formatPrice(item.price)}</div>
                                <div class="cart-item-quantity">
                                    <button class="quantity-btn" data-id="${item.id}" data-action="decrease">-</button>
                                    <span>${item.quantity || 1}</span>
                                    <button class="quantity-btn" data-id="${item.id}" data-action="increase">+</button>
                                </div>
                            </div>
                            <button class="cart-item-remove" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                });
                cartItemsContainer.innerHTML = html;
                if (cartTotalSpan) cartTotalSpan.textContent = formatPrice(total);
            }

            function addToCart(id, name, price, icon, image) {
                const existing = cart.find(i => i.id === id);
                if (existing) existing.quantity = (existing.quantity || 1) + 1;
                else cart.push({ id, name, price, icon: icon || 'fa-leaf', image, quantity: 1 });
                saveCart();
                showToast('✨ ' + name + ' ajouté');
            }

            function removeFromCart(id) {
                cart = cart.filter(i => i.id !== id);
                saveCart();
                showToast('🗑️ Retiré');
            }

            function updateQuantity(id, action) {
                const item = cart.find(i => i.id === id);
                if (!item) return;
                if (action === 'increase') item.quantity = (item.quantity || 1) + 1;
                else if (action === 'decrease') {
                    if (item.quantity > 1) item.quantity -= 1;
                    else { removeFromCart(id); return; }
                }
                saveCart();
            }

            function openCart() {
                cartSidebar?.classList.add('open');
                cartOverlay?.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeCart() {
                cartSidebar?.classList.remove('open');
                cartOverlay?.classList.remove('active');
                document.body.style.overflow = '';
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            // Load all products first
            async function loadAllProducts() {
                try {
                    const response = await fetch('https://dtwciuhwwanwlwpydeko.supabase.co/rest/v1/products?select=*', {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY
                        }
                    });
                    allProducts = await response.json();
                    return allProducts;
                } catch (error) {
                    console.error('Error loading products:', error);
                    return [];
                }
            }

            // Load current product
            async function loadCurrentProduct() {
                if (!productId) {
                    productDetailContainer.innerHTML = '<div class="error-message">❌ Produit non trouvé</div>';
                    return false;
                }

                try {
                    const response = await fetch(`https://dtwciuhwwanwlwpydeko.supabase.co/rest/v1/products?id=eq.${productId}`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY
                        }
                    });
                    const products = await response.json();

                    if (!products || products.length === 0) {
                        productDetailContainer.innerHTML = '<div class="error-message">❌ Produit non trouvé</div>';
                        return false;
                    }

                    currentProduct = products[0];
                    displayProduct(currentProduct);
                    return true;
                } catch (error) {
                    console.error('Error loading product:', error);
                    productDetailContainer.innerHTML = '<div class="error-message">❌ Erreur de chargement</div>';
                    return false;
                }
            }

            // Display product details
            function displayProduct(product) {
                const imgHtml = product.image
                    ? `<img src="${product.image}" alt="${escapeHtml(product.name)}">`
                    : `<i class="fas fa-crown"></i>`;

                const seasonNames = { all: 'Toutes saisons', summer: 'Été', winter: 'Hiver', spring: 'Printemps', autumn: 'Automne' };
                const categoryNames = { man: 'Homme', women: 'Femme', unisexe: 'Unisexe', kids: 'Enfants' };

                const seasonName = seasonNames[product.season] || 'Toutes saisons';
                const categoryName = categoryNames[product.category] || product.category;

                productDetailContainer.innerHTML = `
                    <div class="product-detail">
                        <div class="product-image">
                            ${imgHtml}
                        </div>
                        <div class="product-info">
                            <h1>${escapeHtml(product.name)}</h1>
                            <div class="product-brand">${escapeHtml(product.brand)}</div>
                            <div class="product-meta">
                                <span class="meta-badge"><i class="fas fa-tag"></i> ${categoryName}</span>
                                <span class="meta-badge"><i class="fas fa-calendar-alt"></i> ${seasonName}</span>
                            </div>
                            <div class="product-price">${formatPrice(product.price)}</div>
                            <div class="product-description">${escapeHtml(product.description || 'Découvrez ce parfum d\'exception, une fragrance unique qui révèle votre personnalité.')}</div>
                            <button class="add-to-cart-btn" data-id="${product.id}" data-name="${escapeHtml(product.name)}" data-price="${product.price}" data-icon="${product.icon || 'fa-crown'}" data-image="${product.image || ''}">
                                <i class="fas fa-shopping-cart"></i> Ajouter au panier
                            </button>
                        </div>
                    </div>
                `;

                // Add to cart button handler
                const addBtn = document.querySelector('.add-to-cart-btn');
                if (addBtn) {
                    addBtn.addEventListener('click', () => {
                        addToCart(
                            addBtn.dataset.id,
                            addBtn.dataset.name,
                            parseFloat(addBtn.dataset.price),
                            addBtn.dataset.icon,
                            addBtn.dataset.image
                        );
                    });
                }
            }

            // Load suggestions based on same category AND same season
            function loadSuggestions() {
                if (!currentProduct || !allProducts.length) return;

                // Find suggestions: same category AND same season, exclude current product
                const suggestions = allProducts.filter(p =>
                    p.id !== currentProduct.id &&
                    p.category === currentProduct.category &&
                    p.season === currentProduct.season
                );

                // If not enough suggestions, also add products from same category (different season)
                let finalSuggestions = [...suggestions];
                if (finalSuggestions.length < 4) {
                    const sameCategory = allProducts.filter(p =>
                        p.id !== currentProduct.id &&
                        p.category === currentProduct.category &&
                        p.season !== currentProduct.season
                    );
                    finalSuggestions = [...finalSuggestions, ...sameCategory];
                }

                // Limit to 8 suggestions
                finalSuggestions = finalSuggestions.slice(0, 8);

                if (finalSuggestions.length === 0) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }

                suggestionsContainer.style.display = 'block';

                let html = '';
                finalSuggestions.forEach(product => {
                    const imgHtml = product.image
                        ? `<img src="${product.image}" alt="${escapeHtml(product.name)}">`
                        : `<i class="fas fa-leaf"></i>`;

                    html += `
                        <div class="suggestion-card" onclick="window.location.href='product.html?id=${product.id}'">
                            <div class="suggestion-img">${imgHtml}</div>
                            <div class="suggestion-name">${escapeHtml(product.name)}</div>
                            <div class="suggestion-brand">${escapeHtml(product.brand)}</div>
                            <div class="suggestion-price">${formatPrice(product.price)}</div>
                        </div>
                    `;
                });

                suggestionsGrid.innerHTML = html;
            }

            // Initialize page
            async function init() {
                await loadAllProducts();
                const success = await loadCurrentProduct();
                if (success) {
                    loadSuggestions();
                }
                saveCart();
            }

            init();

            // Cart event listeners
            if (cartItemsContainer) {
                cartItemsContainer.addEventListener('click', (e) => {
                    const rm = e.target.closest('.cart-item-remove');
                    if (rm) { removeFromCart(rm.dataset.id); return; }
                    const qtyBtn = e.target.closest('.quantity-btn');
                    if (qtyBtn) updateQuantity(qtyBtn.dataset.id, qtyBtn.dataset.action);
                });
            }

            if (cartToggle) cartToggle.addEventListener('click', openCart);
            if (closeCartBtn) closeCartBtn.addEventListener('click', closeCart);
            if (cartOverlay) cartOverlay.addEventListener('click', closeCart);

            // Menu toggle
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');
            const menuOverlay = document.getElementById('menuOverlay');

            function toggleMenu() {
                const active = navLinks.classList.contains('active');
                if (active) {
                    navLinks.classList.remove('active');
                    menuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                } else {
                    navLinks.classList.add('active');
                    menuOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    closeCart();
                }
            }

            if (menuToggle) menuToggle.addEventListener('click', toggleMenu);
            if (menuOverlay) menuOverlay.addEventListener('click', toggleMenu);

            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    menuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                });
            });

            // Language menu
            const langMenu = document.getElementById('langMenu');
            const langCurrentBtn = document.querySelector('#langMenu .lang-current');
            if (langCurrentBtn) {
                langCurrentBtn.addEventListener('click', (e) => { e.stopPropagation(); langMenu.classList.toggle('active'); });
            }

            // Theme switcher
            function initTheme() {
                const saved = localStorage.getItem('theme') || 'light';
                if (saved === 'dark') {
                    document.body.classList.add('dark');
                    const sun = document.querySelector('#themeToggle .fa-sun');
                    const moon = document.querySelector('#themeToggle .fa-moon');
                    if (sun) sun.style.display = 'none';
                    if (moon) moon.style.display = 'inline-block';
                }
            }

            function toggleTheme() {
                if (document.body.classList.contains('dark')) {
                    document.body.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    const sun = document.querySelector('#themeToggle .fa-sun');
                    const moon = document.querySelector('#themeToggle .fa-moon');
                    if (sun) sun.style.display = 'inline-block';
                    if (moon) moon.style.display = 'none';
                } else {
                    document.body.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    const sun = document.querySelector('#themeToggle .fa-sun');
                    const moon = document.querySelector('#themeToggle .fa-moon');
                    if (sun) sun.style.display = 'none';
                    if (moon) moon.style.display = 'inline-block';
                }
            }

            const themeToggleBtn = document.getElementById('themeToggle');
            if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);
            initTheme();
        })();
    </script>
</body>

</html>
